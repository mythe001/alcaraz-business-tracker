async function checkMilestones(){
  if(session.noticeShown) return;
  const d = Store.get();
  if(document.getElementById("overlayRoot").innerHTML) return;
  if(daysSince(d.meta.lastModalAt) < CONFIG.modalCooldownDays) return;
  const stats = { count: d.transactions.length, months: Calc.monthsWithData() };
  const msg = MESSAGES.find(m => !d.meta.shownMessages[m.id] && m.when(stats));
  if(!msg) return;
  await Store.markMessageShown(msg.id);
  showDialog({ ...msg, primaryUrl: msg.primaryUrl ? msg.primaryUrl() : null });
}

/* =========================================================
   DRILL-DOWN — the entries behind a figure.
   Category sheet: entries in one category for a month or year
   (its total equals the figure that was tapped).
   Statement sheet: one mode of payment, month by month, with
   a running balance. Tapping an entry opens it for editing and
   returns to the sheet afterwards.
   ========================================================= */
let drillReopen = null; // redraws the sheet currently open

function openDrillSheet(title, sub, body, reopen){
  const ov = openOverlay(`<div class="sheet drill">
    <div class="drill-head"><div><h2>${esc(title)}</h2><p class="muted small" style="margin:0">${esc(sub)}</p></div>
      <button type="button" class="icon-btn" data-action="closeForm" aria-label="Close">×</button></div>
    ${body}</div>`);
  overlayClose = () => closeOverlay();
  drillReopen = reopen;
  return ov;
}
const drillRow = (t, mark, cls, title, sub, right) => `<div class="entry" data-action="drillEdit" data-id="${t.id}" role="button" tabindex="0" aria-label="Edit entry">
    <span class="entry-mark ${cls}" aria-hidden="true">${mark}</span>
    <div class="entry-main"><div class="entry-title">${title}</div><div class="entry-sub">${sub}</div></div>
    <div class="entry-amt num ${cls}">${right}</div>
  </div>`;
const byDateThenCreated = (a, b) => a.date.localeCompare(b.date) || (a.createdAt || "").localeCompare(b.createdAt || "");

// scope is a month ("2026-10") or a year ("2026"); amounts are this category's share of each entry
function categoryEntries(catId, scope){
  const rows = [];
  Store.get().transactions.forEach(t => {
    if(scope.includes("..") ? (t.date < scope.slice(0, 10) || t.date > scope.slice(12)) : !t.date.startsWith(scope + (scope.length === 4 ? "-" : ""))) return;
    let amount = 0;
    if(t.type === "transfer"){ if(t.fee > 0 && t.feeCategoryId === catId) amount = t.fee; }
    else if(Array.isArray(t.lines)) t.lines.forEach(l => { if(l.categoryId === catId) amount += l.amount; });
    else if(t.categoryId === catId) amount = t.amount;
    if(amount) rows.push({ t, amount });
  });
  return rows.sort((a, b) => byDateThenCreated(b.t, a.t));
}
function openCategorySheet(catId, scope){
  const cat = catById(catId), rows = categoryEntries(catId, scope);
  if(!cat || !rows.length) return; // e.g. the last entry was just deleted or moved
  const pmName = id => pmById(id)?.name || "(removed method)";
  const list = rows.map(({ t, amount }) => {
    const isT = t.type === "transfer";
    const where = isT ? `Bank charge · ${esc(pmName(t.fromPaymentMethodId))} → ${esc(pmName(t.toPaymentMethodId))}` : esc(pmName(t.paymentMethodId));
    const part = !isT && t.lines && t.lines.length > 1 ? ` · part of ${peso(t.amount)}` : "";
    return drillRow(t, isT ? "⇄" : cat.type === "sales" ? "+" : "−", isT ? "transfer" : cat.type,
      esc(dateLabel(t.date)), `${where}${part}${t.description ? ` · ${esc(t.description)}` : ""}`, peso(amount));
  }).join("");
  const total = rows.reduce((a, r) => a + r.amount, 0);
  const period = scope.includes("..") ? rangeLabel(scope.slice(0, 10), scope.slice(12)) : scope.length === 4 ? scope : monthLabel(scope);
  openDrillSheet(cat.name, `${cat.type === "sales" ? "Sales" : "Expenses"} · ${period}`,
    `<div class="drill-list">${list}</div>
     <div class="drill-total"><span>Total · ${rows.length} ${rows.length === 1 ? "entry" : "entries"}</span><span class="num">${peso(total)}</span></div>`,
    () => openCategorySheet(catId, scope));
}

// Change in one mode's balance caused by a transaction (0 if it doesn't involve that mode)
function pmEffect(t, pmId){
  if(t.type === "transfer") return (t.toPaymentMethodId === pmId ? t.amount : 0) - (t.fromPaymentMethodId === pmId ? t.amount + (t.fee || 0) : 0);
  return t.paymentMethodId === pmId ? (t.type === "sales" ? t.amount : -t.amount) : 0;
}
function openStatement(pmId, month){
  const pm = pmById(pmId);
  if(!pm) return;
  const type = pmType(pm), sign = type === "payable" ? -1 : 1; // a payable is shown as the amount you owe
  const mine = Store.get().transactions.filter(t => t.paymentMethodId === pmId || t.fromPaymentMethodId === pmId || t.toPaymentMethodId === pmId);
  const opening = mine.filter(t => t.date < month + "-01").reduce((a, t) => a + sign * pmEffect(t, pmId), 0);
  const pmName = id => pmById(id)?.name || "(removed method)";
  let bal = opening;
  const list = mine.filter(t => t.date.startsWith(month)).sort(byDateThenCreated).map(t => {
    const v = sign * pmEffect(t, pmId);
    bal += v;
    const isT = t.type === "transfer";
    const lineCount = Array.isArray(t.lines) ? t.lines.length : 1;
    const title = isT ? (t.fromPaymentMethodId === pmId ? `Transfer to ${esc(pmName(t.toPaymentMethodId))}` : `Transfer from ${esc(pmName(t.fromPaymentMethodId))}`)
      : `${t.type === "sales" ? "Sale" : "Expense"} · ${lineCount > 1 ? `${lineCount} items` : esc(catById(t.lines?.[0]?.categoryId || t.categoryId)?.name || "(removed category)")}`;
    const fee = isT && t.fee > 0 && t.fromPaymentMethodId === pmId ? ` · incl. ${peso(t.fee)} bank charge` : "";
    return drillRow(t, { sales: "+", expense: "−", transfer: "⇄" }[t.type], t.type, title,
      `${esc(dateLabel(t.date))}${fee}${t.description ? ` · ${esc(t.description)}` : ""}`,
      `${v < 0 ? "−" : "+"}${peso(Math.abs(v))}<span class="entry-run">${peso(bal)}</span>`);
  }).join("");
  const balRow = (label, v) => `<div class="drill-bal"><span>${label}</span><span class="num ${v < 0 ? "neg-text" : ""}">${peso(v)}</span></div>`;
  openDrillSheet(pm.name, { cash: "Statement", receivable: "Owed to you", payable: "You owe" }[type],
    `<div class="mnav">
       <button type="button" class="icon-btn" data-action="stmtNav" data-d="-1" aria-label="Previous month">‹</button>
       <strong>${esc(monthLabel(month))}</strong>
       <button type="button" class="icon-btn" data-action="stmtNav" data-d="1" aria-label="Next month">›</button>
     </div>
     ${balRow("Opening balance", opening)}
     ${list ? `<div class="drill-list">${list}</div>` : `<p class="muted small" style="text-align:center;margin:14px 0">No entries in ${esc(monthLabel(month))}.</p>`}
     ${balRow("Closing balance", bal)}`,
    () => openStatement(pmId, month));
  drillMonth = { pmId, month };
}
let drillMonth = null;

/* =========================================================
   LEARN TOOLS — Product Cost & Pricing, Break-even & Profitability.
   Web versions of the course's Google Sheets. Everything is
   computed and saved on the device, like the records.
   Inputs carry data-tk="path" and save as you type; results carry
   data-tko="key" and are refreshed in place (no redraw while typing).
   ========================================================= */
const TK = {
  VAT: 0.12,
  num(v){ const n = parseFloat(String(v ?? "").replace(/[,₱\s]/g, "")); return isFinite(n) ? n : 0; },
  money4(n){ return "₱" + n.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 4 }); },
  pct(n){ return (n * 100).toLocaleString("en-PH", { maximumFractionDigits: 1 }) + "%"; },
  val(n){ return n ? String(n) : ""; },

  // Cost of one unit (gram, ml, piece) of a material = pack price ÷ pack size
  unitCost(m){ const size = TK.num(m.packSize); return size > 0 ? TK.num(m.packPrice) / size : 0; },

  // A product's cost per piece and pricing.
  //   recipe cost  = materials + direct labor + overhead (the last two are optional)
  //   target price = cost per piece ÷ (1 − margin), before VAT; VAT is added on top if switched on
  // Labor and overhead are each marked fixed or variable. Break-even only uses the variable part
  // (varPerPiece): fixed labor/overhead belongs with the fixed expenses there, not in the margin.
  product(p){
    const mats = Store.toolkit().materials;
    const lines = p.lines.map(l => {
      const m = mats.find(x => x.id === l.materialId);
      const unitCost = m ? TK.unitCost(m) : 0;
      return { id: l.id, unit: m ? (m.unit || "") : "", unitCost, cost: unitCost * TK.num(l.qty) };
    });
    const materials = lines.reduce((a, l) => a + l.cost, 0);
    const labor = Math.max(0, TK.num(p.labor)), overhead = Math.max(0, TK.num(p.overhead));
    const batch = materials + labor + overhead;
    const makes = TK.num(p.makes) > 0 ? TK.num(p.makes) : 1;
    const perPiece = batch / makes;
    const varPerPiece = (materials + (p.laborVariable ? labor : 0) + (p.overheadVariable ? overhead : 0)) / makes;
    const margin = TK.num(p.margin) / 100;
    const target = perPiece > 0 && margin < 1 ? perPiece / (1 - margin) : 0;
    const vatRate = p.vat ? TK.VAT : 0;
    const charged = TK.num(p.price);                                 // what the customer pays, if entered
    const price = charged > 0 ? charged / (1 + vatRate) : target;    // selling price before VAT
    return { lines, materials, labor, overhead, batch, makes, perPiece, varPerPiece, fixedPerPiece: perPiece - varPerPiece,
      target, vat: target * vatRate, targetWithVat: target * (1 + vatRate), price, priceWithVat: price * (1 + vatRate),
      actualMargin: price > 0 ? (price - perPiece) / price : 0 };
  },

  // Break-even and profitability across all products for one month.
  //   contribution margin % = (sales − variable product costs − expenses that vary with sales) ÷ sales
  //   sales needed          = (fixed expenses + desired net profit) ÷ contribution margin %
  // then split per product by its share of sales.
  bep(){
    const t = Store.toolkit(), b = t.bep;
    const rows = b.rows.map(r => {
      const p = r.productId ? t.products.find(x => x.id === r.productId) : null;
      const pc = p ? TK.product(p) : null;
      const cost = pc ? pc.varPerPiece : TK.num(r.cost), price = pc ? pc.price : TK.num(r.price), units = TK.num(r.units);
      return { id: r.id, linked: !!p, name: p ? p.name : r.name, cost, price, units, fixedPerPiece: pc ? pc.fixedPerPiece : 0,
        sales: units * price, cogs: units * cost, gp: units * (price - cost), margin: price > 0 ? (price - cost) / price : 0 };
    });
    const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
    const sales = sum(rows, r => r.sales), gp = sum(rows, r => r.gp);
    const fixed = sum(b.expenses.filter(e => !e.variable), e => TK.num(e.amount));
    const variable = sum(b.expenses.filter(e => e.variable), e => TK.num(e.amount));
    const target = Math.max(0, TK.num(b.targetProfit));
    const cm = sales > 0 ? (gp - variable) / sales : 0;
    const needed = cm > 0 ? (fixed + target) / cm : 0;
    rows.forEach(r => {
      r.mix = sales > 0 ? r.sales / sales : 0;
      r.needSales = r.mix * needed;
      r.needUnits = r.price > 0 ? r.needSales / r.price : 0;
    });
    return { rows, units: sum(rows, r => r.units), sales, cogs: sum(rows, r => r.cogs), gp, fixed, variable, target, cm, needed, net: gp - variable - fixed };
  },

  // Follow a path like "products.<id>.lines.<id>.qty"; arrays are searched by id
  resolve(path){
    const parts = path.split(".");
    let node = parts[0] === "draft" ? { draft: ui.tkDraft && ui.tkDraft.data } : Store.toolkit();
    for(let i = 0; i < parts.length - 1; i++){
      node = Array.isArray(node) ? node.find(x => x.id === parts[i]) : node[parts[i]];
      if(node == null) return null;
    }
    return { node, key: parts[parts.length - 1] };
  },
  saveTimer: null,
  saveSoon(){ clearTimeout(TK.saveTimer); TK.saveTimer = setTimeout(() => Store.saveToolkit(), 400); },

  // The product sheet edits a copy (the draft). Nothing is kept until Save is tapped.
  // The draft survives moving around the app; it is only dropped on Save, Cancel, or opening another product.
  openDraft(product){
    const data = product ? JSON.parse(JSON.stringify(product))
      : { name: "", makes: 1, margin: 0, price: 0, labor: 0, overhead: 0, laborVariable: false, overheadVariable: false, vat: false, lines: [] };
    if(!Array.isArray(data.lines)) data.lines = [];
    ui.tkDraft = { id: product ? product.id : null, data, base: JSON.stringify(data) };
  },
  dirty(){ const d = ui.tkDraft; return !!d && JSON.stringify(d.data) !== d.base; },
  // Before the draft is replaced or dropped: ask if it has unsaved changes
  async dropOk(){
    return !TK.dirty() || await confirmDialog("Discard unsaved changes?", `Your changes to "${ui.tkDraft.data.name || "this product"}" have not been saved.`, "Discard");
  },
  tab(view){ return (ui.tkTab && ui.tkTab[view]) || (view === "costing" ? "materials" : "profit"); },

  // Fill in every result on screen from the current inputs
  refresh(){
    const out = {}, t = Store.toolkit();
    if(ui.view === "costing"){
      t.materials.forEach(m => { out[`mat.${m.id}`] = TK.unitCost(m) ? TK.money4(TK.unitCost(m)) : ""; });
      const p = TK.tab("costing") === "product" && ui.tkDraft ? ui.tkDraft.data : null;
      out.draftStatus = !ui.tkDraft ? "" : TK.dirty() ? "Unsaved changes" : ui.tkDraft.id ? "All changes saved" : "Not saved yet";
      if(p){
        const c = TK.product(p);
        c.lines.forEach(l => { out[`line.${l.id}.unit`] = l.unit || " "; out[`line.${l.id}.unitCost`] = l.unitCost ? TK.money4(l.unitCost) : ""; out[`line.${l.id}.cost`] = l.unitCost ? peso(l.cost) : ""; });
        out.materials = peso(c.materials); out.batch = peso(c.batch); out.perPiece = TK.money4(c.perPiece);
        out.target = c.target ? peso(c.target) : "—";
        out.vat = c.target ? peso(c.vat) : "—"; out.targetWithVat = c.target ? peso(c.targetWithVat) : "—";
        out.actual = c.price > 0 ? TK.pct(c.actualMargin) : "—";
      }
      document.querySelectorAll("option[data-mat]").forEach(o => { const m = t.materials.find(x => x.id === o.dataset.mat); if(m) o.textContent = m.name || "(unnamed)"; });
      document.querySelectorAll("[data-prodname]").forEach(el => { const x = t.products.find(y => y.id === el.dataset.prodname); if(x) el.textContent = x.name || "(unnamed)"; });
    }
    if(ui.view === "breakeven"){
      const r = TK.bep();
      r.rows.forEach(x => {
        out[`row.${x.id}.sales`] = peso(x.sales); out[`row.${x.id}.gp`] = peso(x.gp); out[`row.${x.id}.cogs`] = peso(x.cogs);
        out[`row.${x.id}.cost`] = TK.money4(x.cost); out[`row.${x.id}.price`] = peso(x.price);
        out[`row.${x.id}.margin`] = x.price > 0 ? TK.pct(x.margin) : "";
        out[`need.${x.id}.name`] = x.name || "(unnamed)"; out[`need.${x.id}.mix`] = TK.pct(x.mix);
        out[`need.${x.id}.weighted`] = TK.pct(x.mix * x.margin);
        out[`need.${x.id}.sales`] = peso(x.needSales); out[`need.${x.id}.units`] = Math.ceil(x.needUnits - 1e-9).toLocaleString("en-PH");
      });
      out.units = r.units.toLocaleString("en-PH"); out.sales = peso(r.sales); out.cogs = peso(r.cogs); out.gp = peso(r.gp);
      out.fixed = peso(r.fixed); out.variable = peso(r.variable); out.net = peso(r.net);
      out.grossPct = r.sales > 0 ? TK.pct(r.gp / r.sales) : "—"; out.varPct = r.sales > 0 ? TK.pct(r.variable / r.sales) : "—";
      out.cm = r.sales > 0 ? TK.pct(r.cm) : "—"; out.mixTotal = r.sales > 0 ? "100%" : "—";
      out.needLabel = r.target > 0 ? `Monthly Sales Needed to Earn ${peso(r.target)}` : "Monthly Break-even Point in Sales";
      out.needed = r.cm > 0 ? peso(r.needed) : "—";
      // Pieces are rounded up per product, so the total is the sum of those whole numbers
      out.needUnits = r.cm > 0 ? r.rows.reduce((a, x) => a + Math.ceil(x.needUnits - 1e-9), 0).toLocaleString("en-PH") : "—";
      out.warn = !r.rows.length ? "Add at least one product in the Profitability tab to see your break-even."
        : r.sales <= 0 ? "Enter how many you sell in a month in the Profitability tab to see your break-even."
        : r.cm <= 0 ? "At these prices and costs, each sale doesn't cover its own variable costs, so selling more won't reach break-even. Review your prices or costs."
        : r.sales >= r.needed ? (r.target > 0 ? "You are already at or above this goal at your current sales." : "You are already above break-even at your current sales.") : "";
    }
    document.querySelectorAll("[data-tko]").forEach(el => { const v = out[el.dataset.tko]; if(v !== undefined) el.textContent = v; });
  }
};

// Typing in a tool input saves it and refreshes the results in place
document.addEventListener("input", e => {
  const path = e.target.dataset && e.target.dataset.tk;
  if(!path) return;
  const spot = TK.resolve(path);
  if(!spot) return;
  const el = e.target;
  spot.node[spot.key] = el.dataset.tkBool !== undefined ? el.value === "1" : el.dataset.tkNum !== undefined ? TK.num(el.value) : el.value.slice(0, 60);
  if(!path.startsWith("draft.")) TK.saveSoon(); // the product sheet is only kept when Save is tapped
  if(el.dataset.tkRedraw !== undefined) render(); else TK.refresh(); // a few choices add or remove rows
});

// The row and column under the cursor are highlighted so wide tables are easy to follow
document.addEventListener("mouseover", e => {
  const td = e.target.closest && e.target.closest(".tk-sheet td");
  document.querySelectorAll(".tk-sheet th.on").forEach(th => th.classList.remove("on"));
  if(!td || td.colSpan > 1 || td.classList.contains("x")) return;
  const th = td.closest("table").querySelectorAll("thead th")[td.cellIndex];
  if(th && td.parentElement.cells.length === th.parentElement.cells.length) th.classList.add("on");
});

// Closing or reloading the page with an unsaved product sheet asks first
window.addEventListener("beforeunload", e => { if(TK.dirty()){ e.preventDefault(); e.returnValue = ""; } });

// The tools are laid out like the course's spreadsheets: tinted cells are typed in, plain cells are computed
const tkCell = (path, value, opts = {}) => `<td class="in"><input data-tk="${path}" ${opts.num ? 'data-tk-num inputmode="decimal" autocomplete="off"' : 'maxlength="60"'} placeholder="${esc(opts.ph || "")}" value="${esc(opts.num ? TK.val(value) : (value || ""))}" aria-label="${esc(opts.label || "")}"></td>`;
const tkPick = (path, on, labels, redraw) => `<td class="in"><select data-tk="${path}" data-tk-bool ${redraw ? "data-tk-redraw" : ""} aria-label="${esc(labels.join(" or "))}">
  <option value="0" ${on ? "" : "selected"}>${labels[0]}</option><option value="1" ${on ? "selected" : ""}>${labels[1]}</option></select></td>`;
const tkCalc = (key, text) => `<td class="calc ${text ? "" : "num"}" data-tko="${key}"></td>`;
const tkX = (path, what) => `<td class="x"><button type="button" class="tk-x" data-action="tkRemove" data-path="${path}" aria-label="Remove ${what}">×</button></td>`;
// Number columns have right-aligned headings, to sit above their right-aligned figures
const TK_TEXT_COLS = /^(Ingredient Name|Purchase Unit|Unit of Measure|Name|Expense|Type|Product|Monthly Break-even|Sent|Approved|Email|Method|Payment|Reference|Action)/;
const tkSheet = (head, body, minWidth, add) => `<div class="tk-scroll"><table class="tk-sheet" ${add ? `data-add="${add}"` : ""} style="min-width:${minWidth}px"><thead><tr>${head.map(h => `<th class="${TK_TEXT_COLS.test(h) ? "" : "num"}">${h}</th>`).join("")}<th class="x"></th></tr></thead><tbody>${body}</tbody></table></div>`;
const tkBack = `<button class="btn ghost small-btn tk-back" data-action="nav" data-view="learn">‹ ${TOOLKIT_LABEL}</button>`;
const tkGetSheet = url => url ? `<a class="btn small-btn tk-get" href="${esc(url)}" target="_blank" rel="noopener">Get the Google Sheet</a>` : "";
// Admin only: how many payments are waiting, shown on the menu item
const tkBadge = () => { const n = TKA.isAdmin() && ui.tkAdmin && ui.tkAdmin.data ? ui.tkAdmin.data.counts.pending : 0; return n ? `<span class="nav-badge" aria-label="${n} waiting for approval">${n}</span>` : ""; };
// Calculator work lives on the device: say so, and offer the backup right there
const tkSavedNote = () => `<p class="tk-saved muted small"><span>Your work here is saved on this device only. ${esc(lastBackupText())}.</span><button class="btn small-btn" data-action="backup">Back up now</button></p>`;
const tkLegend = `<p class="tk-legend"><i class="in"></i> You type here <i class="calc"></i> Computed for you</p>`;
// Buttons sit beside each table's heading, not inside the table. An empty table shows a short prompt instead.
const tkBtn = (label, action, attrs = "", cls = "") => `<button type="button" class="btn small-btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
const tkBar = (title, tools, tag = "h2") => `<div class="tk-bar"><${tag}>${title}</${tag}><span class="tk-tools">${tools || ""}</span></div>`;

// Which month "Fill from Tracker" would use: last month, or this month if last month has no expenses. null if neither has any.
function tkTrackerMonth(){
  const last = shiftMonth(thisMonth(), -1);
  if(Calc.monthTotals(last).expenses > 0) return last;
  return Calc.monthTotals(thisMonth()).expenses > 0 ? thisMonth() : null;
}

// "Add product" in Break-even: pick saved products (their cost and price stay linked) or type one in
function openProductChooser(){
  const t = Store.toolkit(), b = t.bep;
  const manual = () => Actions.tkAdd({ dataset: { what: "row" } });
  const avail = t.products.filter(p => !b.rows.some(r => r.productId === p.id));
  if(!avail.length) return manual();
  const ov = openOverlay(`<div class="dialog"><h2>Add products</h2>
    <div class="body"><p>Choose from the products you saved in Product Cost &amp; Pricing. Their cost and price stay linked.</p>
      ${avail.map(p => { const c = TK.product(p); return `<label class="check tk-pick"><input type="checkbox" value="${p.id}"> <span><b>${esc(p.name || "(unnamed)")}</b><small>Variable cost ${TK.money4(c.varPerPiece)} · Price ${c.price > 0 ? peso(c.price) : "not set"}</small></span></label>`; }).join("")}
    </div>
    <div class="actions">
      <button class="btn primary block" id="pcAdd">Add selected</button>
      <button class="btn block" id="pcManual">Type one in manually</button>
      <button class="btn ghost block" id="pcCancel">Cancel</button>
    </div></div>`, true);
  overlayClose = () => closeOverlay();
  ov.querySelector("#pcCancel").addEventListener("click", closeOverlay);
  ov.querySelector("#pcManual").addEventListener("click", () => { closeOverlay(); manual(); });
  ov.querySelector("#pcAdd").addEventListener("click", () => {
    const ids = [...ov.querySelectorAll("input:checked")].map(i => i.value);
    if(!ids.length){ toast("Tick at least one product."); return; }
    ids.forEach(id => b.rows.push({ id: Store.newId() + id.slice(-3), productId: id, units: 0 }));
    closeOverlay(); Store.saveToolkit(); render();
  });
}

// Enter in a table moves down the column, like a spreadsheet; on the last row it adds a new one
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" || !e.target.matches || !e.target.matches(".tk-sheet td.in input")) return;
  e.preventDefault();
  const td = e.target.closest("td"), tr = td.parentElement, table = tr.closest("table");
  const below = tr.nextElementSibling && tr.nextElementSibling.cells[td.cellIndex];

/* =========================================================
   TOOLKIT ACCOUNT — Google sign-in and membership (Supabase).
   Only the Toolkit uses an account; the Tracker's records never
   leave the device. The server decides who is a member: the app
   can only call the tk_* functions, which answer for the signed-in
   Google account. Statuses: signed_in → pending → active.
   The last known status is kept on the device so a member's
   calculators still open offline.
   ========================================================= */
const TKA = {
  // The Toolkit lives in the "alcaraz-accounting-dev" Supabase project, for the local copy and the live site alike.
  // (Decided 2026-10-06: it stays there until paying members justify its own project. Do not reset the tk_ tables.)
  cfg: { url: "https://euuolfvjnlxikpzibrfm.supabase.co", key: "sb_publishable_Jdup1KVFE4W4PqYjG2-pNQ_EajwdbT2" },
  KEY: "alcaraz-business-tracker-toolkit",
  state: { session: null, me: null, content: {} },

  load(){ try{ Object.assign(this.state, JSON.parse(localStorage.getItem(this.KEY) || "{}")); }catch(e){} },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.state)); }catch(e){} },
  signedIn(){ return !!(this.state.session && this.state.me); },
  status(){ return this.state.me ? this.state.me.status : null; },
  isAdmin(){ return !!(this.state.me && this.state.me.is_admin); },
  isMember(){ return this.signedIn() && (this.state.me.status === "active" || this.isAdmin()); },

  // Send the browser to Google; it comes back to this page with the session in the address
  signIn(){
    location.href = `${this.cfg.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.origin + location.pathname)}`;
  },
  // Called once at startup. Returns true if we just came back from Google.
  takeReturn(){
    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    if(!hash.get("access_token") && !hash.get("error")) return false;
    history.replaceState(history.state, "", location.pathname + location.search); // keep tokens out of the address bar
    if(hash.get("error")){
      let why = hash.get("error_description") || "Sign-in was cancelled.";
      try{ why = decodeURIComponent(why); }catch(e){}
      // The provider appends a one-time code after the colon; it means nothing to the user
      this.returnError = why.replace(/^(Unable to exchange external code).*/i, "$1. The Google sign-in settings need to be checked.");
      return true;
    }
    this.state.session = { access_token: hash.get("access_token"), refresh_token: hash.get("refresh_token"),
      expires_at: Date.now() + (Number(hash.get("expires_in")) || 3600) * 1000 };
    this.state.me = null; this.state.content = {};
    this.save();
    return true;
  },
  async token(){
    const s = this.state.session;
    if(!s) throw new Error("Not signed in.");
    if(Date.now() < s.expires_at - 60000) return s.access_token;
    const res = await fetch(`${this.cfg.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST",
      headers: { apikey: this.cfg.key, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if(!res.ok){
      // The session can no longer be renewed: sign out on this device
      if(res.status === 400 || res.status === 401 || res.status === 403){ this.state = { session: null, me: null, content: {} }; this.save(); }
      throw new Error("Please sign in again.");
    }
    const j = await res.json();
    this.state.session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 };
    this.save();
    return j.access_token;
  },
  async rpc(fn, args){
    const res = await fetch(`${this.cfg.url}/rest/v1/rpc/${fn}`, { method: "POST",
      headers: { apikey: this.cfg.key, Authorization: `Bearer ${await this.token()}`, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) });
    const j = await res.json().catch(() => null);
    if(!res.ok) throw new Error((j && j.message) || "Something went wrong. Please try again.");
    return j;
  },
  // Ask the server who we are and, for members, fetch the member-only links
  async refresh(){
    this.state.me = await this.rpc("tk_me");
    if(this.isMember()){ try{ this.state.content = await this.rpc("tk_get_content"); }catch(e){} }
    else this.state.content = {};
    this.save();
    return this.state.me;
  },
  async signOut(){
    const s = this.state.session;
    this.state = { session: null, me: null, content: {} }; this.save();
    if(s){ try{ await fetch(`${this.cfg.url}/auth/v1/logout`, { method: "POST", headers: { apikey: this.cfg.key, Authorization: `Bearer ${s.access_token}` } }); }catch(e){} }
  }
};

// A lesson: the video, what to do next, and the previous/next lesson.
// Video ids come from the server and are only sent to members.
Views.lesson = function(){
  if(!TK.isMember()) return Views.learn();
  const all = TOOLKIT.modules.flatMap(m => m.lessons.map(l => ({ ...l, module: m })));
  const i = Math.max(0, all.findIndex(l => l.key === ui.tkLesson)), lesson = all[i];
  const videos = TKA.state.content.videos, id = videos && videos.lessons && videos.lessons[lesson.key];
  // Video links are signed by the server and expire after a few hours: fetch fresh ones when they run out
  const stale = !!(videos && videos.expires && videos.expires * 1000 < Date.now() + 120000);
  if(id && stale && navigator.onLine !== false && Date.now() - (ui.tkLinksTried || 0) > 15000){
    ui.tkLinksTried = Date.now();
    setTimeout(() => Actions.tkCheckLesson(), 0);
    return `<div class="page-head tk-head">${tkBack}<h1>${esc(lesson.title)}</h1></div><p class="muted">Loading the video…</p>`;
  }
  const sign = videos && videos.tokens && videos.tokens[lesson.key] ? `&token=${esc(videos.tokens[lesson.key])}&expires=${esc(videos.expires)}` : "";
  const player = id && !stale
    ? `<div class="tk-video"><iframe src="https://player.mediadelivery.net/embed/${esc(videos.library)}/${esc(id)}?autoplay=false&preload=false&responsive=true${sign}" title="${esc(lesson.title)}" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
    : `<div class="tk-empty"><p>${navigator.onLine === false ? "You're offline. Connect to the internet to watch this lesson." : "This lesson's video couldn't be loaded. Check your connection and try again."}</p><span class="tk-tools">${tkBtn("Try again", "tkCheckLesson")}</span></div>`;
  const tool = lesson.module.tool && TOOLKIT.tools.find(t => t.view === lesson.module.tool);
  const next = lesson.module.link === "manager" && CONFIG.links.toolkitMessenger
    ? `<section class="card"><p style="margin:0 0 10px"><b>Thinking of moving to Manager.io?</b> Jesse can help you set it up for your business.</p>
        <a class="btn tk-send" href="${esc(CONFIG.links.toolkitMessenger)}" target="_blank" rel="noopener">Message Jesse on Messenger</a></section>`
    : tool ? `<section class="card"><p style="margin:0 0 10px"><b>Try it with your own numbers.</b> ${esc(tool.sub)}.</p>
        <button class="btn primary" data-action="nav" data-view="${tool.view}">Open the ${esc(tool.title)}</button></section>` : "";
  return `<div class="page-head tk-head">${tkBack}<h1>${esc(lesson.title)}</h1></div>
    <p class="muted small" style="margin:-10px 0 4px">${esc(lesson.module.title)} · Lesson ${i + 1} of ${all.length}</p>
    <p style="margin:0 0 12px">${esc(lesson.sub || "")}</p>
    <div class="stack">
      ${player}
      ${next}
      <div class="tk-lessonnav">
        ${i > 0 ? `<button class="btn" data-action="tkLesson" data-key="${all[i - 1].key}">‹ ${esc(all[i - 1].title)}</button>` : "<span></span>"}
        ${i < all.length - 1 ? `<button class="btn primary" data-action="tkLesson" data-key="${all[i + 1].key}">Next: ${esc(all[i + 1].title)} ›</button>` : ""}
      </div>
    </div>`;
};

Views.breakeven = function(){
  if(!TK.isMember()) return Views.learn();
  const t = Store.toolkit(), b = t.bep, tab = TK.tab("breakeven");
  const head = `<div class="page-head tk-head">${tkBack}${tkGetSheet(TKA.state.content.breakevenSheet)}<h1>Break-even &amp; Profitability</h1></div>
    ${tkTabs("breakeven", [["profit", "Profitability"], ["bep", "Break-even Point"]])}${tkSavedNote()}`;

  if(tab === "bep"){
    const needRows = b.rows.map(r => `<tr>${tkCalc(`need.${r.id}.name`, true)}${tkCalc(`need.${r.id}.mix`)}${tkCalc(`row.${r.id}.margin`)}${tkCalc(`need.${r.id}.weighted`)}${tkCalc(`need.${r.id}.sales`)}${tkCalc(`need.${r.id}.units`)}<td class="x"></td></tr>`).join("");
    const step = (label, key, cls) => `<tr class="${cls || ""}"><td class="lbl">${label}</td>${tkCalc(key)}<td class="x"></td></tr>`;
    return `${head}${tkLegend}
      <section class="card"><h2>Break-even Point Calculator</h2>
        ${tkSheet(["Monthly Break-even Point (in sales)", "Amount"],
          step("Total Fixed Expenses", "fixed")
          + `<tr><td class="lbl">Add: Desired Net Profit — optional</td>${tkCell("bep.targetProfit", b.targetProfit, { num: true, ph: "0.00", label: "Desired net profit per month" })}<td class="x"></td></tr>`
          + step("Weighted Margin of Your Products", "grossPct") + step("Less: Expenses that Vary with Sales (% of sales)", "varPct")
          + step("Divided by: Contribution Margin", "cm", "total")
          + `<tr class="key"><td class="lbl" data-tko="needLabel"></td>${tkCalc("needed")}<td class="x"></td></tr>`, 420)}
        <p class="hint" data-tko="warn"></p>
        ${needRows ? `<h3 class="sub-h" style="margin-top:18px">Per product</h3>
          ${tkSheet(["Name of Product", "Sales Mix %", "Contribution Margin<small>in %</small>", "Weighted Margin", "Sales Needed", "Units Needed"],
            needRows + `<tr class="total"><td class="lbl">TOTAL</td>${tkCalc("mixTotal")}<td class="calc"></td>${tkCalc("grossPct")}${tkCalc("needed")}${tkCalc("needUnits")}<td class="x"></td></tr>`, 620)}
          <p class="muted small" style="margin:10px 0 0">This assumes you keep selling your products in the same proportions as now. Units are rounded up to whole pieces.</p>` : ""}
      </section>`;
  }

  const calc = TK.bep();
  const rows = b.rows.map(r => {
    const linked = r.productId && t.products.some(x => x.id === r.productId);
    return `<tr>
      ${linked ? `${tkCalc(`need.${r.id}.name`, true)}${tkCalc(`row.${r.id}.cost`)}${tkCalc(`row.${r.id}.price`)}`
               : `${tkCell(`bep.rows.${r.id}.name`, r.name, { ph: "e.g. Product A", label: "Product name" })}
                  ${tkCell(`bep.rows.${r.id}.cost`, r.cost, { num: true, ph: "0.00", label: "Variable cost per unit" })}
                  ${tkCell(`bep.rows.${r.id}.price`, r.price, { num: true, ph: "0.00", label: "Selling price" })}`}
      ${tkCalc(`row.${r.id}.margin`)}
      ${tkCell(`bep.rows.${r.id}.units`, r.units, { num: true, ph: "0", label: "Monthly sales in units" })}
      ${tkCalc(`row.${r.id}.sales`)}${tkCalc(`row.${r.id}.cogs`)}${tkCalc(`row.${r.id}.gp`)}${tkX(`bep.rows.${r.id}`, "product")}</tr>`;
  }).join("");
  // Products whose costing includes fixed labor/overhead: that part must be listed as a fixed expense here
  const withFixed = calc.rows.filter(r => r.linked && r.fixedPerPiece > 0.00005);

  const expenses = b.expenses.map(e => `<tr>
      ${tkCell(`bep.expenses.${e.id}.name`, e.name, { ph: "e.g. Rent", label: "Expense" })}
      ${tkCell(`bep.expenses.${e.id}.amount`, e.amount, { num: true, ph: "0.00", label: "Amount per month" })}
      ${tkPick(`bep.expenses.${e.id}.variable`, e.variable, ["Fixed", "Varies with sales"])}
      ${tkX(`bep.expenses.${e.id}`, "expense")}</tr>`).join("");
  const expFoot = (label, key, cls) => `<tr class="${cls || ""}"><td class="lbl">${label}</td>${tkCalc(key)}<td class="calc"></td><td class="x"></td></tr>`;

  return `${head}${tkLegend}
    <section class="card">${tkBar("Profitability Calculator", b.rows.length ? TK_ADD.row : "")}
      <p class="muted small" style="margin:0 0 10px"><b>Variable cost per unit</b> is only what rises with every piece you make or sell: materials, packaging, piece-rate labor. Costs you pay regardless of how much you sell (salaries, rent) go in the expenses below as Fixed.</p>
      ${!b.rows.length ? tkEmpty("No products yet. Add the products you sell to see your profitability.", TK_ADD.row) : tkSheet(["Name of Product", "Variable Cost per Unit", "Selling Price", "Contribution Margin<small>in %</small>", "Total Monthly Sales in Units", "Monthly Sales", "Monthly Variable Cost", "Contribution"],
        rows + `
          <tr class="total"><td class="lbl">TOTAL</td><td class="calc"></td><td class="calc"></td><td class="calc"></td>${tkCalc("units")}${tkCalc("sales")}${tkCalc("cogs")}${tkCalc("gp")}<td class="x"></td></tr>`, 780, "row")}
      ${withFixed.length ? `<div class="tk-note"><b>Check your fixed costs.</b> In Product Cost &amp; Pricing, ${withFixed.map(r => `<b>${esc(r.name || "(unnamed)")}</b> includes ${TK.money4(r.fixedPerPiece)} per piece of fixed labor or overhead`).join("; ")}. That part is left out of the variable cost above, because it does not change with how much you sell. Make sure the same labor or overhead is in your expenses below as <b>Fixed</b>, so it is counted once.</div>` : ""}
      ${tkBar("Less: Selling and Administrative Expenses", TK_ADD.expense + (tkTrackerMonth() ? tkBtn(`Fill from Tracker (${esc(monthLabel(tkTrackerMonth()))})`, "tkFromTracker", "", "tk-alt") : ""), "h3")}
      <p class="muted small" style="margin:0 0 10px"><b>Fixed</b> stays the same whether you sell a lot or a little (rent, salaries). <b>Varies with sales</b> goes up as you sell more (delivery fees, commissions).</p>
      ${tkSheet(["Expense", "Amount per Month", "Type"],
        expenses + (b.expenses.length ? "" : tkEmptyRow(3, "No expenses yet. Add them one by one, or fill them from your Tracker records."))
        + expFoot("Total Fixed Expenses", "fixed", "total") + expFoot("Total Expenses that Vary with Sales", "variable", "total")
        + expFoot("Net Profit/(Loss)", "net", "key"), 440, "expense")}
    </section>`;
};

function openDeleteDialog(){
  const ov = openOverlay(`<div class="dialog delete-dialog">
    <h2>Delete all data?</h2>
    <div class="body"><p>This permanently deletes your records on this device. It can't be undone.</p></div>
    <div class="tip-card">
      <p style="margin:0 0 4px"><b>We recommend making a backup first.</b></p>
      <p style="margin:0 0 8px">If you change your mind later, you can restore it.</p>
      <p class="muted small" style="margin:0 0 10px" id="delLastBackup">${esc(lastBackupText())}</p>
      <button class="btn" id="delBackup">Back up now</button>
    </div>
    <label class="check"><input type="checkbox" id="delKeep" checked> <span>Keep my categories and payment methods</span></label>
    <label class="field"><span>Type DELETE to confirm</span>
      <input id="delConfirm" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <div class="actions">
      <button class="btn solid-danger block" id="delGo" disabled>Delete all data</button>
      <button class="btn ghost block" id="delCancel">Cancel</button>
    </div>
  </div>`, true);
  overlayClose = () => closeOverlay();
  const $ = sel => ov.querySelector(sel);
  $("#delCancel").addEventListener("click", closeOverlay);

  // Back up without leaving the dialog
  $("#delBackup").addEventListener("click", async () => {
    const how = await saveBackup();
    if(!how) return;
    await Store.markBackup();
    const line = $("#delLastBackup");
    if(line) line.textContent = "✓ Backup made just now";
    if(how !== "downloaded") toast("✅ Backup saved.");
  });

  // Accept "delete" in any case (phone keyboards often capitalize)
  const input = $("#delConfirm"), go = $("#delGo");

/* =========================================================
   FILES — backup, restore, CSV
   Inside claude.ai the platform download capability is used;
   when self-hosted (Netlify/Vercel) a normal browser download.
   ========================================================= */
const downloadsReady = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null)
  : Promise.resolve(null);

async function offerFile(filename, data, mime){
  const dl = await downloadsReady;
  if(dl){
    try{ await dl.save({ filename, data }); return true; }
    catch(e){
      if(e && e.code === "declined") return false;
      toast(e && e.code === "rate_limited" ? "A download prompt is already open." : "Download isn't available here.");
      return false;
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = Object.assign(document.createElement("a"), { href: url, download: filename });
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ toast("Download isn't available here."); return false; }
}

function backupFileName(ext){
  const d = new Date();
  return `Business Tracker backup ${todayISO()} ${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
}
const isTouchDevice = () => window.matchMedia("(pointer: coarse)").matches;

// Returns "shared" | "saved" | "downloaded", or false if cancelled/failed
async function saveBackup(){
  const data = Store.exportData();

  // Phones: open the share menu so the user can pick Google Drive.
  // Chrome only shares certain file types, so fall back from .json to .txt (same contents).
  if(isTouchDevice() && navigator.canShare && navigator.share){
    for(const [ext, type] of [["json", "application/json"], ["txt", "text/plain"]]){
      const file = new File([data], backupFileName(ext), { type });
      if(!navigator.canShare({ files: [file] })) continue;
      try{
        await navigator.share({ files: [file], title: "Business Tracker backup" });
        return "shared";
      }catch(e){
        if(e && e.name === "AbortError") return false; // user closed the share menu
        break; // sharing failed; fall back to download below
      }
    }
  }

  // Chrome/Edge on computers: "Save as" window, so it can go straight into a Google Drive folder
  if(!isTouchDevice() && window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: backupFileName("json"),
        types: [{ description: "Business Tracker backup", accept: { "application/json": [".json"] } }]
      });
      const w = await handle.createWritable(); await w.write(data); await w.close();
      return "saved";
    }catch(e){
      if(e && e.name === "AbortError") return false;
      // not allowed here (e.g. inside a frame): fall back to download
    }
  }

  const ok = await offerFile(backupFileName("json"), data, "application/json");
  return ok ? "downloaded" : false;
}

function lastBackupText(){
  const at = Store.get().meta.lastBackupAt;
  return at ? `Last backup: ${new Date(at).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" })}` : "No backup yet";
}
function needsBackupReminder(){
  const d = Store.get();
  if(!d.transactions.length) return false;
  const since = d.meta.lastBackupAt || d.meta.firstUsedAt;
  return daysSince(since) >= CONFIG.backupReminderDays;
}

function buildCsv(){
  const cell = v => { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [["Date","Type","Category","Mode of Payment","Description","Amount"]];
  Store.get().transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    if(t.type === "transfer"){
      const from = pmById(t.fromPaymentMethodId)?.name || "", to = pmById(t.toPaymentMethodId)?.name || "";
      rows.push([t.date, "Transfer", "Transfer", `${from} → ${to}`, t.description || "", t.amount.toFixed(2)]);
      if(t.fee > 0) rows.push([t.date, "Expense", catById(t.feeCategoryId)?.name || "Bank Charges", from, "Bank charge on transfer", t.fee.toFixed(2)]);
      return;
    }
    if(Array.isArray(t.lines)){
      t.lines.forEach(line => rows.push([t.date, t.type === "sales" ? "Sales" : "Expense", catById(line.categoryId)?.name || "", pmById(t.paymentMethodId)?.name || "", t.description || "", Number(line.amount || 0).toFixed(2)]));
    } else {
      rows.push([t.date, t.type === "sales" ? "Sales" : "Expense", catById(t.categoryId)?.name || "", pmById(t.paymentMethodId)?.name || "", t.description || "", t.amount.toFixed(2)]);
    }
  });
  return "\ufeff" + rows.map(r => r.map(cell).join(",")).join("\r\n");
}

  if(siblings.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())){ e.target.value = item.name; toast("That name already exists."); return; }
  await Store.renameItem(listName, id, name);
  toast("Renamed.");
});

document.addEventListener("keydown", e => {
  // Rows and cards that act as buttons (entries, drill-down targets)
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-action]')){
    e.preventDefault(); Actions[e.target.dataset.action](e.target); return;
  }
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.enter){
    e.preventDefault();
    const btn = document.getElementById(e.target.dataset.enter);
    if(btn) Actions[btn.dataset.action](btn);
  }
});

document.getElementById("restoreFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if(!file) return;
  let parsed;
  try{ parsed = Store.parseBackup(JSON.parse(await file.text())); }catch(err){ parsed = null; }
  if(!parsed){ toast("This file isn't a valid Alcaraz Business Tracker backup."); return; }
  const ok = await confirmDialog("Restore this backup?",
    `This replaces the ${Store.get().transactions.length} transactions on this device with ${parsed.transactions.length} from the backup.`, "Restore");
  if(!ok) return;
  Store.importData(parsed);
  go("dashboard"); toast("Backup restored.");
});

   START
   ========================================================= */
Store.init().then(async () => {
  const backFromGoogle = TKA.takeReturn(); // must run first: it removes the sign-in tokens from the address
  // A reload keeps the browser's history entries, so reopen the view they describe
  const s = histState();
  if(s && isView(s.view) && Store.get().setupDone) ui.view = s.view;
  else try{ history.replaceState({ abt: true, view: ui.view, depth: 0 }, ""); }catch(e){}
  render();
  syncHistory();
  registerServiceWorker();
  requestPersistentStorage();
  const shown = await showUpdateNotice();
  if(!shown && Store.get().setupDone) setTimeout(checkMilestones, 600);
  Stats.maybeSend();
  // Toolkit: finish a sign-in, or quietly re-check a known member's status when online
  if(backFromGoogle) Actions.tkAfterSignIn();
  else if(TKA.state.session && navigator.onLine !== false) TKA.refresh().then(async () => {
    if(TKA.isAdmin()){ await Actions.tkAdminLoad(); render(); } // for the "waiting for approval" count on the menu
    else if(ui.view === "learn" || TOOL_VIEWS.includes(ui.view)) render();
  }).catch(() => {});
});
</script>
