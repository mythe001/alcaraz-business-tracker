/* =========================================================
   FILES — backup, restore, CSV
   Inside claude.ai the platform download capability is used;
   when self-hosted (Netlify/Vercel) a normal browser download.
   ========================================================= */
const downloadsReady = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null)
  : Promise.resolve(null);

async function offerFile(filename, data, mime){
  const dl = await downloadsReady;
  if(dl){
    try{ await dl.save({ filename, data }); return true; }
    catch(e){
      if(e && e.code === "declined") return false;
      toast(e && e.code === "rate_limited" ? "A download prompt is already open." : "Download isn't available here.");
      return false;
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = Object.assign(document.createElement("a"), { href: url, download: filename });
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ toast("Download isn't available here."); return false; }
}

function backupFileName(ext){
  const d = new Date();
  return `Business Tracker backup ${todayISO()} ${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
}
const isTouchDevice = () => window.matchMedia("(pointer: coarse)").matches;

// Returns "shared" | "saved" | "downloaded", or false if cancelled/failed
async function saveBackup(){
  const data = Store.exportData();

  // Phones: open the share menu so the user can pick Google Drive.
  // Chrome only shares certain file types, so fall back from .json to .txt (same contents).
  if(isTouchDevice() && navigator.canShare && navigator.share){
    for(const [ext, type] of [["json", "application/json"], ["txt", "text/plain"]]){
      const file = new File([data], backupFileName(ext), { type });
      if(!navigator.canShare({ files: [file] })) continue;
      try{
        await navigator.share({ files: [file], title: "Business Tracker backup" });
        return "shared";
      }catch(e){
        if(e && e.name === "AbortError") return false; // user closed the share menu
        break; // sharing failed; fall back to download below
      }
    }
  }

  // Chrome/Edge on computers: "Save as" window, so it can go straight into a Google Drive folder
  if(!isTouchDevice() && window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: backupFileName("json"),
        types: [{ description: "Business Tracker backup", accept: { "application/json": [".json"] } }]
      });
      const w = await handle.createWritable(); await w.write(data); await w.close();
      return "saved";
    }catch(e){
      if(e && e.name === "AbortError") return false;
      // not allowed here (e.g. inside a frame): fall back to download
    }
  }

  const ok = await offerFile(backupFileName("json"), data, "application/json");
  return ok ? "downloaded" : false;
}

function lastBackupText(){
  const at = Store.get().meta.lastBackupAt;
  return at ? `Last backup: ${new Date(at).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" })}` : "No backup yet";
}
function needsBackupReminder(){
  const d = Store.get();
  if(!d.transactions.length) return false;
  const since = d.meta.lastBackupAt || d.meta.firstUsedAt;
  return daysSince(since) >= CONFIG.backupReminderDays;
}

function buildCsv(){
  const cell = v => { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [["Date","Type","Category","Mode of Payment","Description","Amount"]];
  Store.get().transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    if(t.type === "transfer"){
      const from = pmById(t.fromPaymentMethodId)?.name || "", to = pmById(t.toPaymentMethodId)?.name || "";
      rows.push([t.date, "Transfer", "Transfer", `${from} → ${to}`, t.description || "", t.amount.toFixed(2)]);
      if(t.fee > 0) rows.push([t.date, "Expense", catById(t.feeCategoryId)?.name || "Bank Charges", from, "Bank charge on transfer", t.fee.toFixed(2)]);
      return;
    }
    if(Array.isArray(t.lines)){
      t.lines.forEach(line => rows.push([t.date, t.type === "sales" ? "Sales" : "Expense", catById(line.categoryId)?.name || "", pmById(t.paymentMethodId)?.name || "", t.description || "", Number(line.amount || 0).toFixed(2)]));
    } else {
      rows.push([t.date, t.type === "sales" ? "Sales" : "Expense", catById(t.categoryId)?.name || "", pmById(t.paymentMethodId)?.name || "", t.description || "", t.amount.toFixed(2)]);
    }
  });
  return "\ufeff" + rows.map(r => r.map(cell).join(",")).join("\r\n");
}

/* =========================================================
   ACTIONS
   ========================================================= */
const Actions = {
  nav: el => go(el.dataset.view),
  // Usage stats choice, from the dashboard banner or the Settings switch
  statsConsent(el){
    const yes = el.type === "checkbox" ? el.checked : el.dataset.v === "yes";
    Store.setStats({ consent: yes ? "yes" : "no" });
    render();
    if(yes){ toast("Thank you! Anonymous stats are on."); Stats.maybeSend(); }
    else if(el.type === "checkbox") toast("Anonymous stats are off.");
  },
  dashMode: el => { ui.dashMode = el.dataset.v; render(); },
  dashStep(el){
    const d = Number(el.dataset.d);
    if(ui.dashMode === "month") ui.month = shiftMonth(ui.month, d);
    else { dashPeriod(); ui.dashDate = shiftDay(ui.dashDate, ui.dashMode === "week" ? d * 7 : d); ui.month = ui.dashDate.slice(0, 7); }
    render();
  },
  mprev: () => { ui.month = shiftMonth(ui.month, -1); render(); },
  mnext: () => { ui.month = shiftMonth(ui.month, 1); render(); },
  summaryMode: el => { ui.summaryMode = el.dataset.v; if(ui.summaryMode === "year") ui.year = ui.month.slice(0, 4); render(); },
  yprev: () => { ui.year = String(Number(ui.year) - 1); render(); },
  ynext: () => { ui.year = String(Number(ui.year) + 1); render(); },
  txFilter: el => { ui.txFilter = el.dataset.v; render(); },
  openAdd: () => openTxForm(null),
  closeForm: () => closeOverlay(),
  editTx: el => { const t = Store.get().transactions.find(x => x.id === el.dataset.id); if(t) openTxForm(t); },
  async deleteTx(el){
    const id = el.dataset.id;
    const back = sheetReturn; sheetReturn = null; // return to the drill-down sheet after the confirm, not before
    closeOverlay();
    if(await confirmDialog("Delete this transaction?", "This can't be undone.", "Delete")){
      await Store.deleteTransaction(id);
      render(); toast("Transaction deleted.");
    }
    if(back) back();
  },
  drillCat: el => openCategorySheet(el.dataset.id, el.dataset.scope),
  drillPm: el => openStatement(el.dataset.id, thisMonth()),
  stmtNav: el => { if(drillMonth) openStatement(drillMonth.pmId, shiftMonth(drillMonth.month, Number(el.dataset.d))); },
  drillEdit(el){
    const t = Store.get().transactions.find(x => x.id === el.dataset.id);
    if(!t) return;
    const reopen = drillReopen;
    openTxForm(t);
    sheetReturn = reopen;
  },
  formType(el){
    const prev = formType;
    formType = el.dataset.v;
    const form = document.getElementById("txForm");
    const isT = formType === "transfer";
    form.querySelectorAll('[data-action="formType"]').forEach(b => b.classList.toggle("on", b.dataset.v === formType));
    form.querySelector("#grpRegular").classList.toggle("hidden", isT);
    form.querySelector("#grpTransfer").classList.toggle("hidden", !isT);
    form.querySelector("#grpTransferAmount").classList.toggle("hidden", !isT);
    if(!isT && prev !== formType){
      // Sales and Expense offer different modes: redraw them, keeping the choice when it still fits
      const [keepType, keepId] = (form.dataset.keepPm || ":").split(":");
      const keep = keepType === formType ? keepId : null;
      const cur = form.querySelector('input[name="paymentMethodId"]:checked')?.value;
      const ok = id => { const p = pmById(id); return p && (id === keep || PM_TYPES_FOR[formType].includes(pmType(p))); };
      form.querySelector("#pmRegular").innerHTML = pmChips("paymentMethodId", ok(cur) ? cur : lastCashPm(), "Mode of Payment", PM_TYPES_FOR[formType], keep);
      form.querySelectorAll('[name="lineCategory"]').forEach(select => { select.innerHTML = categoryOptions(formType, ""); });
      updateLineTotal(form);
    }
    syncPmFields(form);
    form.querySelector("#formErr").textContent = "";
  },
  // Receivables/payables offer for existing users
  async rpAdd(){
    const d = Store.get();
    const named = re => d.paymentMethods.filter(p => re.test(p.name));
    const found = { receivable: named(/\b(receivables?|a\/?r|collectibles?|pautang)\b/i), payable: named(/\b(payables?|a\/?p|utang)\b/i) };
    const plan = { setTypes: [], add: [] }, body = [];
    ["receivable", "payable"].forEach(type => {
      if(found[type].length){
        found[type].forEach(p => plan.setTypes.push({ id: p.id, type }));
        body.push(`${found[type].map(p => `"${p.name}"`).join(", ")} will be set as ${PM_TYPE_LABEL[type]}.`);
      } else {
        plan.add.push(type);
        body.push(`A new "${RP_DEFAULTS[type].name}" mode will be added.`);
      }
    });
    // Modes that already look like AR/AP are retyped instead of adding duplicates, so ask first
    if(plan.setTypes.length){
      const r = await showDialog({ title: "Track receivables and payables", body: [...body, "You can change this anytime in Settings."], primaryLabel: "OK", secondaryLabel: "Cancel" });
      if(r !== "primary") return;
    }
    await Store.applyRpOffer(plan);
    render(); toast(plan.setTypes.length ? "Receivables and payables are set up." : "Added: Receivable and Payable. Change them in Settings.");
  },
  async rpDismiss(){ await Store.applyRpOffer(); render(); },
  async addItem(el){
    const input = document.getElementById(el.dataset.input);
    const name = input.value.trim();
    const listName = el.dataset.list, type = el.dataset.type || null;
    if(!name){ toast("Enter a name first."); input.focus(); return; }
    const d = Store.get();
    const existing = listName === "paymentMethods" ? d.paymentMethods : d.categories.filter(c => c.type === type);
    if(existing.some(x => x.name.toLowerCase() === name.toLowerCase())){ toast("That name already exists."); return; }
    await Store.addItem(listName, listName === "paymentMethods" ? { name } : { name, type });
    render(); toast(`Added: ${name}`);
    const again = document.getElementById(el.dataset.input); if(again) again.focus();
  },
  async removeItem(el){
    const listName = el.dataset.list, id = el.dataset.id;
    const d = Store.get();
    const item = (listName === "paymentMethods" ? d.paymentMethods : d.categories).find(x => x.id === id);
    if(!item) return;
    const used = Store.usageCount(listName, id);
    if(used){ toast(`"${item.name}" is used in ${used} transaction${used > 1 ? "s" : ""}. Rename it instead.`); return; }
    const siblings = listName === "paymentMethods" ? d.paymentMethods : d.categories.filter(c => c.type === item.type);
    if(siblings.length <= 1){ toast("Keep at least one."); return; }
    await Store.removeItem(listName, id);
    render();
  },
  async startTracking(){ await Store.completeSetup(); ui.view = "dashboard"; render(); window.scrollTo(0, 0); },
  async backup(){
    const how = await saveBackup();
    if(!how) return;
    await Store.markBackup(); render();
    // Plain downloads get no message: the browser's own save window/download bar
    // appears after the click, and a message here would pop up before it.
    if(how !== "downloaded") toast("✅ Backup saved.");
  },
  restore: () => document.getElementById("restoreFile").click(),
  async exportCsv(){
    if(!Store.get().transactions.length){ toast("No transactions to export yet."); return; }
    const ok = await offerFile(`alcaraz-business-tracker-${todayISO()}.csv`, buildCsv(), "text/csv");
    if(ok) toast("CSV exported.");
  },
  openSupport,
  openDelete: () => openDeleteDialog(),
  hideBanner(el){ session[el.dataset.b] = true; render(); },
  async installApp(){
    if(!installPrompt) return;
    installPrompt.prompt();
    try{ await installPrompt.userChoice; }catch(e){}
    installPrompt = null; render();
  },
  setTheme(el){
    const theme = el.dataset.v === "dark" ? "dark" : "light";
    Store.setTheme(theme);
    applyTheme(theme);
    render();
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const fn = Actions[el.dataset.action];
  if(!fn) return;
  e.stopPropagation(); // row click vs. Edit/Delete buttons inside the row
  fn(el);
});

document.addEventListener("change", async e => {
  const pmId = e.target.dataset && e.target.dataset.pmType;
  if(pmId){ await Store.setPaymentMethodType(pmId, e.target.value); render(); toast(`Type set to ${PM_TYPE_LABEL[pmType(pmById(pmId))]}.`); return; }
  const listName = e.target.dataset && e.target.dataset.renameList;
  if(!listName) return;
  const id = e.target.dataset.id, name = e.target.value.trim();
  const d = Store.get();
  const item = (listName === "paymentMethods" ? d.paymentMethods : d.categories).find(x => x.id === id);
  if(!item) return;
  if(!name){ e.target.value = item.name; toast("Name can't be blank."); return; }
  const siblings = listName === "paymentMethods" ? d.paymentMethods : d.categories.filter(c => c.type === item.type);
  if(siblings.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())){ e.target.value = item.name; toast("That name already exists."); return; }
  await Store.renameItem(listName, id, name);
  toast("Renamed.");
});

document.addEventListener("keydown", e => {
  // Rows and cards that act as buttons (entries, drill-down targets)
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-action]')){
    e.preventDefault(); Actions[e.target.dataset.action](e.target); return;
  }
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.enter){
    e.preventDefault();
    const btn = document.getElementById(e.target.dataset.enter);
    if(btn) Actions.addItem(btn);
  }
});

document.getElementById("restoreFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if(!file) return;
  let parsed;
  try{ parsed = Store.parseBackup(JSON.parse(await file.text())); }catch(err){ parsed = null; }
  if(!parsed){ toast("This file isn't a valid Alcaraz Business Tracker backup."); return; }
  const ok = await confirmDialog("Restore this backup?",
    `This replaces the ${Store.get().transactions.length} transactions on this device with ${parsed.transactions.length} from the backup.`, "Restore");
  if(!ok) return;
  Store.importData(parsed);
  go("dashboard"); toast("Backup restored.");
});

Store.init().then(async () => {
  // A reload keeps the browser's history entries, so reopen the view they describe
  const s = histState();
  if(s && isView(s.view) && Store.get().setupDone) ui.view = s.view;
  else try{ history.replaceState({ abt: true, view: ui.view, depth: 0 }, ""); }catch(e){}
  render();
  syncHistory();
  registerServiceWorker();
  requestPersistentStorage();
  const shown = await showUpdateNotice();
  if(!shown && Store.get().setupDone) setTimeout(checkMilestones, 600);
  Stats.maybeSend();
});
