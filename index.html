<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Alcaraz Business Tracker</title>
<meta name="theme-color" content="#1B3A6B">
<meta name="description" content="Free, simple sales and expense tracker for small businesses. By Jesse Alcaraz, CPA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biz Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* =========================================================
   DESIGN TOKENS — neutral placeholder styling.
   Visual direction is handled separately; restyle from here.
   ========================================================= */
:root{
  /* Navy = primary/business, Teal = supporting info, Green = positive/net,
     light blue-gray background, white cards, blue-gray secondary text */
  --bg:#F1F4F8; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --text:#16294A; --text-2:#5F6F86; --text-3:#94A1B4;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --brand:#1B3A6B; --brand-ink:#FFFFFF; --brand-soft:#E6ECF6;
  --info:#0E8A87; --info-soft:#E0F3F2;
  --sales:#15803D; --sales-soft:#E3F5E9;
  --expense:#B42318; --expense-soft:#FDECEA;
  --shadow:0 1px 2px rgba(22,41,74,.04), 0 4px 16px -8px rgba(22,41,74,.12);
  --radius:14px;
  --font:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
/* Dark theme — opt-in only (Settings → Appearance). Light stays the default. */
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#172033; --surface-2:#1E293B;
  --text:#F1F5F9; --text-2:#A8B3C5; --text-3:#718096;
  --border:#293548; --border-strong:#3A4960;
  --brand:#6B8FC9; --brand-ink:#FFFFFF; --brand-soft:#243553;
  --info:#2AA6A2; --info-soft:#163B3C;
  --sales:#4CAF70; --sales-soft:#173A27;
  --expense:#E06B61; --expense-soft:#432422;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 4px 16px -8px rgba(0,0,0,.45);
  color-scheme:dark;
}
/* Dark-mode touch-ups for the few spots that don't use variables alone */
:root[data-theme="dark"] .overlay{background:rgba(3,7,18,.6)}
:root[data-theme="dark"] .chip input:checked + span{background:var(--brand-soft);color:var(--text);border-color:var(--brand)}
:root[data-theme="dark"] .seg button.on{box-shadow:none}
:root[data-theme="dark"] .toast{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
:root[data-theme="dark"] .dialog.support .qr{border-color:transparent}
:root[data-theme="dark"] .hero-add{box-shadow:none}
:root[data-theme="dark"] .cash-total-card{background:var(--brand-soft);color:var(--text);border:1px solid var(--brand)}

/* ================= Base ================= */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button,a,.entry,.chip span{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.small{font-size:.875rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{line-height:1.25;margin:0}

/* ================= Layout ================= */
.shell{min-height:100%}
.sidebar{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.topbar .brand-name{font-weight:800;font-size:1.05rem;color:var(--brand)}
main{max-width:960px;margin:0 auto;padding:12px 18px 120px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.page-head h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav .in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:600px;margin:0 auto}
.bottomnav button{border:0;background:none;padding:10px 4px 12px;font-size:.78rem;font-weight:600;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomnav button.on{color:var(--brand)}
.bottomnav svg,.sidebar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:2rem;line-height:1;box-shadow:var(--shadow);display:grid;place-items:center}

@media (min-width:900px){
  .topbar,.bottomnav,.fab{display:none}
  .shell{display:grid;grid-template-columns:250px 1fr}
  .sidebar{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:22px 16px;background:var(--surface);border-right:1px solid var(--border)}
  .sidebar .brand-name{font-weight:800;font-size:1.1rem;line-height:1.25;color:var(--brand)}
  .sidebar .brand-tag{font-size:.8rem;color:var(--text-2);margin:4px 0 20px}
  .sidebar .add-btn{margin-bottom:18px}
  .side-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--text-2)}
  .side-link:hover{background:var(--surface-2)}
  .side-link.on{background:var(--brand-soft);color:var(--brand)}
  .side-sep{height:1px;background:var(--border);margin:12px 4px}
  .side-foot{margin-top:auto;font-size:.82rem;color:var(--text-3)}
  .side-foot button{border:0;background:none;padding:0;color:var(--text-2);text-decoration:underline;font-size:.82rem}
  main{padding:28px 32px 60px}
}

/* ================= Components ================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:12px}
.stack{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--expense);border-color:var(--expense)}
.btn.solid-danger{background:var(--expense);border-color:var(--expense);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.danger-row b{color:var(--expense)}
.delete-dialog{max-height:92vh;overflow:auto}
.delete-dialog .tip-card{margin:4px 0 14px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;margin:4px 0 2px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.btn.ghost{border-color:transparent;background:transparent}

.mnav{display:flex;align-items:center;gap:6px}
.mnav strong{min-width:150px;text-align:center;font-size:1.05rem}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-size:1.25rem;line-height:1;display:grid;place-items:center}

.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--text-2);min-height:38px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .type-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:8px 6px}
.seg .type-btn small{font-size:.72rem;font-weight:500;opacity:.8;margin-top:2px}
.seg.type button.on[data-v="sales"]{background:var(--sales-soft);color:var(--sales)}
.seg.type button.on[data-v="expense"]{background:var(--expense-soft);color:var(--expense)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--surface);border:1px solid var(--border);border-top:3px solid transparent;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.metric .label{font-size:.85rem;font-weight:600;color:var(--text-2)}
.metric .value{font-size:clamp(1.25rem,4.5vw,1.6rem);font-weight:800;letter-spacing:-.01em;margin:4px 0 2px;overflow-wrap:anywhere}
.metric.sales .value{color:var(--text)}
.metric.expense .value{color:var(--expense)}
.metric .value.neg{color:var(--expense)}
.metric .value.pos,.pos-text{color:var(--sales)}
.metric.net{border-top:3px solid var(--sales)}
.cmp{font-size:.8rem;color:var(--text-3)}
.cmp.good{color:var(--sales)}
.cmp.bad{color:var(--expense)}

.dash-grid{display:grid;gap:16px;margin-top:16px}
@media (min-width:900px){.dash-grid{grid-template-columns:1fr 1fr}}

.card.cash{border-top:3px solid var(--info)}
.cash-total span:last-child{color:var(--info)}
.cash-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.cash-row:last-of-type{border-bottom:0}
.cash-total .neg-text{color:var(--expense)!important}
.cash-total{display:flex;justify-content:space-between;gap:12px;margin-top:6px;padding-top:12px;border-top:2px solid var(--border-strong);font-weight:800;font-size:1.1rem}
.neg-text{color:var(--expense)}

.brk{display:grid;gap:12px}
.brk .line{display:flex;justify-content:space-between;gap:10px;font-size:.93rem}
.brk .line b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--info)}

.empty{text-align:center;padding:36px 18px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface)}
.empty p{margin:0 0 14px;color:var(--text-2)}

/* Transactions table */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tx-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
table.tx{width:100%;border-collapse:collapse;font-size:.93rem}
table.tx th{text-align:left;font-size:.8rem;font-weight:700;color:var(--text-2);padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tx td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top}
table.tx tr:last-child td{border-bottom:0}
table.tx tbody tr{cursor:pointer}
table.tx tbody tr:hover{background:var(--surface-2)}
table.tx .amt{text-align:right;font-weight:700;white-space:nowrap}
table.tx th.amt{text-align:right}
.amt.sales{color:var(--sales)}
.amt.transfer{color:var(--info)}
.hidden{display:none!important}
.hint{font-size:.8rem;color:var(--text-3);margin-top:6px}
.pill.transfer{background:var(--info-soft);color:var(--info)}
.amt.expense{color:var(--expense)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.sales{background:var(--sales-soft);color:var(--sales)}
.pill.expense{background:var(--expense-soft);color:var(--expense)}
.row-actions{white-space:nowrap;text-align:right}
.row-actions button{border:0;background:none;color:var(--text-2);font-weight:600;padding:4px 6px;text-decoration:underline}
.m-sub{display:none;font-size:.82rem;color:var(--text-2)}
.tx-foot{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:.9rem;color:var(--text-2)}
.tx-foot b{color:var(--text)}
@media (max-width:699px){
  table.tx .c-type,table.tx .c-pm,table.tx .c-desc,table.tx .c-act{display:none}
  .m-sub{display:block}
  table.tx td,table.tx th{padding:11px 12px}
}

@media (max-width:699px){.filters .seg{width:100%}.filters .seg button{padding:8px 6px;font-size:.9rem}}
/* Hero add + header */
.subtitle{margin:4px 0 0;color:var(--text-2)}
.updated{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:.8rem;color:var(--text-3)}
.updated .dot{width:7px;height:7px;border-radius:50%;background:var(--sales);opacity:.8}
.hero-add{min-height:50px;padding:12px 22px;font-size:1.02rem;border-radius:12px;box-shadow:0 6px 18px -8px color-mix(in srgb, var(--brand) 70%, transparent)}
.dash-head{align-items:flex-start}
@media (max-width:899px){.hero-add{display:none}}
.beta{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--info-soft);color:var(--info);vertical-align:middle}
.topbar .beta{margin-left:8px}
.topbar{justify-content:flex-start}
.sidebar .add-btn{border-color:var(--brand);color:var(--brand)}

/* Empty states */
.empty.big{padding:48px 22px}
.empty.big h2{font-size:1.25rem;font-weight:800;margin:10px 0 6px}
.empty-icon{width:52px;height:52px;margin:0 auto;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty-inline{padding:14px;border:1px dashed var(--border-strong);border-radius:12px;text-align:center}
.empty-inline p{margin:0 0 4px}

/* Cash position cards */
.cash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cash-card{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.cash-label{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.cash-icon{display:inline-grid;color:var(--info)}
.cash-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cash-value{font-size:1.15rem;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cash-total-card{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--brand);color:var(--brand-ink)}
.cash-total-card .cash-label{color:inherit;opacity:.85}
.cash-total-card .cash-value{font-size:1.6rem}

/* Ledger */
.ledger{display:grid;gap:18px}
.day-label{font-size:.82rem;font-weight:700;color:var(--text-2);margin:0 0 6px 4px}
.day-entries{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.entry{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border);cursor:pointer}
.entry:first-child{border-top:0}
.entry:hover{background:var(--surface-2)}
.entry-mark{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem}
.entry-mark.sales{background:var(--sales-soft);color:var(--sales)}
.entry-mark.expense{background:var(--expense-soft);color:var(--expense)}
.entry-mark.transfer{background:var(--info-soft);color:var(--info)}
.entry-main{flex:1;min-width:0}
.entry-title{font-weight:600}
.entry-sub{font-size:.84rem;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-sub.transfer{white-space:normal;overflow:visible;text-overflow:clip}
.entry-sub.transfer .entry-fee{display:block}
.entry-amt{font-weight:800;white-space:nowrap}
.entry-amt.sales{color:var(--sales)} .entry-amt.expense{color:var(--expense)} .entry-amt.transfer{color:var(--info)}
.entry-actions{display:none;white-space:nowrap}
.entry-actions button{border:0;background:none;color:var(--text-2);font-weight:600;padding:4px 6px;text-decoration:underline;font-size:.85rem}
@media (min-width:900px){.entry-actions{display:block}}

/* Banners & update bar */
.banner{display:flex;align-items:center;gap:10px;background:var(--brand-soft);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 10px 10px 14px;margin:0 0 14px;font-size:.9rem}
.banner > div{flex:1;min-width:0}
.banner.stack{flex-wrap:wrap;padding:12px 14px}
.banner.stack > div{flex-basis:100%}
.banner-btns{display:flex;gap:8px}
.banner.warn{background:var(--expense-soft)}
.banner-x{flex:none;width:32px;height:32px;border:0;background:transparent;color:var(--text-2);font-size:1.2rem;border-radius:8px}
.small-btn{min-height:36px;padding:6px 12px;font-size:.88rem;flex:none}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);box-shadow:var(--shadow);border-radius:14px;padding:8px 8px 8px 16px;font-weight:600;font-size:.92rem;max-width:92vw}
@media (min-width:900px){.update-bar{bottom:24px}}

.tip-card{background:var(--info-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:.92rem;color:var(--text)}

/* Settings groups */
.theme-seg{width:100%;max-width:320px}
.settings-group{display:grid;gap:12px;margin-bottom:28px}
.settings-group > *,.ledger > *,.day-entries{min-width:0}
.le-add{flex-wrap:wrap}.le-add input{min-width:140px}
.group-label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 0 -2px 4px}
.sub-h{font-size:.85rem;font-weight:700;color:var(--text-2);margin:14px 0 8px}
.card > h2 + .sub-h{margin-top:0}
.list-card{padding:0;overflow:hidden}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:none;padding:14px 18px;color:var(--text)}
.list-row:first-child{border-top:0}
.list-row:hover{background:var(--surface-2)}
.list-row small{display:block;font-size:.82rem;color:var(--text-2);font-weight:400}
.list-row > span:last-child{color:var(--text-3);font-size:1.3rem}

/* Summary */
.sum-table{width:100%;border-collapse:collapse;font-size:.95rem}
.sum-table td{padding:9px 0;border-bottom:1px solid var(--border)}
.sum-table td:last-child{text-align:right;white-space:nowrap}
.sum-table tr.zero td{color:var(--text-3)}
.sum-table tr.total td{font-weight:800;border-bottom:0;border-top:2px solid var(--border-strong)}
.net-box{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.net-box .v{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800}

/* List editor (setup + settings) */
.le{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.le-row{display:flex;gap:8px}
.le-row input,.le-add input,.field input,.field select{flex:1;min-width:0;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface)}
.le-row button{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-size:1.15rem}
.le-add{display:flex;gap:8px;margin-top:4px}
.le-add button{flex:none}

/* Setup */
.setup{max-width:640px;margin:0 auto;padding:28px 18px 60px}
.setup h1{font-size:1.8rem;font-weight:800;letter-spacing:-.01em}
.setup .tag{color:var(--brand);font-weight:600;margin:6px 0 14px}
.setup .intro{color:var(--text-2);margin:0 0 22px}
.setup .card{margin-bottom:16px}

/* Form sheet */
.overlay{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-height,100%);background:rgba(8,14,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:calc(100% - 12px);overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet h2{font-size:1.3rem;font-weight:800;margin-bottom:14px}
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:.85rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select{width:100%}

<body>
<div id="app"></div>
<input type="file" id="restoreFile" class="sr-only" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="overlayRoot"></div>

<script>
/* =========================================================
   CONFIG — replace placeholders before launch
   ========================================================= */
const CONFIG = {
  appName: "Alcaraz Business Tracker",
  tagline: "Simple numbers tracking for small businesses",
  author: "Jesse Alcaraz",
  version: "0.8.0",
  // Shown once in the update notice after each new version. Leave "" to show only the safety message.
  releaseNote: "You can now choose to share anonymous usage stats to help improve the app. Your records still stay on your device.",
  backupReminderDays: 14,
  beta: true, // shows the "Public Beta" badge
  gcashQr: "gcash-qr.png", // image file uploaded alongside index.html
  links: {
    profitabilityReview: "https://m.me/jrmalcaraz?ref=tracker_profitability",
    accountingSystem:    "https://m.me/jrmalcaraz?ref=tracker_system",
    course:              "https://forms.gle/CmBsXQLVDqmNRAMJ8",              // Accounting for Business Owners
    // Where buyers send their proof of payment
    toolkitMessenger: "https://m.me/jrmalcaraz",
  },
  modalCooldownDays: 3 // minimum days between milestone messages
};

/* =========================================================
   STORE — the only place that reads/writes data.
   To move to Supabase later, replace `adapter` (load/save)
   and keep the rest of the app unchanged.
   ========================================================= */
// Each mode of payment is money you hold (cash), money owed to you (receivable) or money you owe (payable)
const PM_TYPES = ["cash", "receivable", "payable"];
const PM_TYPE_LABEL = { cash: "Cash", receivable: "Receivable", payable: "Payable" };
const RP_DEFAULTS = {
  receivable: { name: "Receivable", type: "receivable", subtitle: "Babayaran ng customer" },
  payable: { name: "Payable", type: "payable", subtitle: "Babayaran mo pa" }
};
const pmType = p => (p && PM_TYPES.includes(p.type)) ? p.type : "cash";

const Store = (() => {
  const KEY = "alcaraz-business-tracker-v1";
  const THEME_KEY = "alcaraz-business-tracker-theme";
  const VERSION_KEY = "alcaraz-business-tracker-seen-version";
  const STATS_KEY = "alcaraz-business-tracker-stats";

  const adapter = {
    async load(){
      try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
      catch(e){ return null; }
    },
    async save(data){ localStorage.setItem(KEY, JSON.stringify(data)); }
  };

  let data = null;
  let onError = () => {};

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function defaults(){
    const sales = ["Product Sales","Service Income","Other Sales"];
    const expense = ["Salaries & Wages","Rent","Internet","Water","Electricity","Bookkeeper","Taxes & Licenses","Supplies","Transportation","Marketing","Bank Charges","Other Expenses"];
    const categories = [
      ...sales.map(name => ({ id: uid(), name, type: "sales" })),
      ...expense.map(name => ({ id: uid(), name, type: "expense" }))
    ];
    const bankCharges = categories.find(c => c.name === "Bank Charges");
    return {
      schemaVersion: 1,
      setupDone: false,
      categories,
      paymentMethods: [
        ...["Cash","GCash","Bank"].map(name => ({ id: uid(), name, type: "cash" })),
        { id: uid(), ...RP_DEFAULTS.receivable },
        { id: uid(), ...RP_DEFAULTS.payable }
      ],
      transactions: [],
      meta: { shownMessages: {}, lastModalAt: null, lastPaymentMethodId: null, bankChargeCategoryId: bankCharges.id, bankChargesSeeded: true, rpOfferDone: true, firstUsedAt: new Date().toISOString() }
    };
  }

  function isValid(d){
    if(!d || !Array.isArray(d.categories) || !Array.isArray(d.paymentMethods) || !Array.isArray(d.transactions)) return false;
    const catOk = d.categories.every(c => c && typeof c.id==="string" && typeof c.name==="string" && (c.type==="sales"||c.type==="expense"));
    const pmOk = d.paymentMethods.every(p => p && typeof p.id==="string" && typeof p.name==="string");
    const txOk = d.transactions.every(t => {
      if(!t || typeof t.id!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(t.date) || typeof t.amount!=="number" || !isFinite(t.amount)) return false;
      if(t.type==="sales" || t.type==="expense"){
        if(typeof t.paymentMethodId!=="string") return false;
        if(t.lines !== undefined){
          return Array.isArray(t.lines) && t.lines.length > 0
            && t.lines.every(l => l && typeof l.categoryId==="string" && typeof l.amount==="number" && isFinite(l.amount));
        }
        return typeof t.categoryId==="string";
      }
      if(t.type==="transfer") return typeof t.fromPaymentMethodId==="string" && typeof t.toPaymentMethodId==="string"
        && (t.fee===undefined || (typeof t.fee==="number" && isFinite(t.fee) && t.fee>=0));
      return false;
    });
    return catOk && pmOk && txOk;
  }

  function normalize(d){
    d.schemaVersion = 1;
    d.setupDone = d.setupDone !== false;
    d.meta = Object.assign({ shownMessages:{}, lastModalAt:null, lastPaymentMethodId:null, bankChargeCategoryId:null, firstUsedAt:new Date().toISOString() }, d.meta || {});
    // Modes created before v0.7.0 have no type: they are all cash.
    // (meta.rpOfferDone stays unset for that data, so the dashboard offers receivables/payables once.)
    d.paymentMethods.forEach(p => { p.type = pmType(p); });
    // One-time upgrade: add the Bank Charges default to data created before v0.2.1.
    // If the user later removes it, it is not added back.
    if(!d.meta.bankChargesSeeded){
      let c = d.categories.find(x => x.id === d.meta.bankChargeCategoryId && x.type === "expense")
           || d.categories.find(x => x.type === "expense" && x.name.toLowerCase() === "bank charges");
      if(!c){
        c = { id: uid(), name: "Bank Charges", type: "expense" };
        const otherIdx = d.categories.findIndex(x => x.type === "expense" && x.name.toLowerCase() === "other expenses");
        if(otherIdx > -1) d.categories.splice(otherIdx, 0, c); else d.categories.push(c);
      }
      d.meta.bankChargeCategoryId = c.id;
      d.meta.bankChargesSeeded = true;
    }
    // Transaction line-item upgrade: preserve existing single-line transactions.
    d.transactions.forEach(t => {
      if((t.type === "sales" || t.type === "expense") && !Array.isArray(t.lines)){
        t.lines = [{ categoryId: t.categoryId, amount: t.amount }];
      }
      if((t.type === "sales" || t.type === "expense") && Array.isArray(t.lines)){
        t.amount = Math.round(t.lines.reduce((sum, line) => sum + (Number(line.amount) || 0), 0) * 100) / 100;
        if(!t.categoryId && t.lines[0]) t.categoryId = t.lines[0].categoryId;
      }
    });
    d.schemaVersion = 2;
    return d;
  }

  function commit(){
    return adapter.save(data).catch(() => onError("Could not save on this device. Download a backup before closing."));
  }

  const list = name => (name === "paymentMethods" ? data.paymentMethods : data.categories);

  return {
    async init(){
      const d = await adapter.load();
      data = isValid(d) ? normalize(d) : defaults();
      if(d) commit();
    },
    setErrorHandler(fn){ onError = fn; },
    get(){ return data; },

    // Transactions
    addTransaction(t){
      const now = new Date().toISOString();
      data.transactions.push({ id: uid(), ...t, createdAt: now, updatedAt: now });
      // Remembered as the next entry's default. Never a receivable/payable mode.
      if(t.paymentMethodId && pmType(data.paymentMethods.find(p => p.id === t.paymentMethodId)) === "cash") data.meta.lastPaymentMethodId = t.paymentMethodId;
      return commit();
    },
    updateTransaction(id, patch){
      const i = data.transactions.findIndex(x => x.id === id);
      if(i > -1){
        const old = data.transactions[i];
        // Replace fields so switching type (e.g. Expense → Transfer) leaves no stale fields
        data.transactions[i] = { id, createdAt: old.createdAt, ...patch, updatedAt: new Date().toISOString() };
      }
      return commit();
    },
    deleteTransaction(id){
      data.transactions = data.transactions.filter(x => x.id !== id);
      return commit();
    },

    // Categories & payment methods
    addItem(listName, fields){
      list(listName).push({ id: uid(), ...fields });
      return commit();
    },
    renameItem(listName, id, name){
      const item = list(listName).find(x => x.id === id);
      if(item) item.name = name;
      return commit();
    },
    setPaymentMethodType(id, type){
      const item = data.paymentMethods.find(x => x.id === id);
      if(item && PM_TYPES.includes(type) && item.type !== type){ item.type = type; delete item.subtitle; }
      return commit();
    },
    // Receivables/payables offer for data created before v0.7.0
    applyRpOffer({ setTypes = [], add = [] } = {}){
      setTypes.forEach(({ id, type }) => { const p = data.paymentMethods.find(x => x.id === id); if(p) p.type = type; });
      add.forEach(type => data.paymentMethods.push({ id: uid(), ...RP_DEFAULTS[type] }));
      data.meta.rpOfferDone = true;
      return commit();
    },
    removeItem(listName, id){
      if(listName === "paymentMethods") data.paymentMethods = data.paymentMethods.filter(x => x.id !== id);
      else data.categories = data.categories.filter(x => x.id !== id);
      return commit();
    },
    usageCount(listName, id){
      if(listName === "paymentMethods")
        return data.transactions.filter(t => t.paymentMethodId === id || t.fromPaymentMethodId === id || t.toPaymentMethodId === id).length;
      return data.transactions.filter(t => Array.isArray(t.lines)
        ? t.lines.some(line => line.categoryId === id) || (t.fee > 0 && t.feeCategoryId === id)
        : t.categoryId === id || (t.fee > 0 && t.feeCategoryId === id)).length;
    },
    // Bank charges on transfers are counted as an expense under this category (created on first use)
    ensureBankChargeCategory(){
      const cats = data.categories;
      let c = cats.find(x => x.id === data.meta.bankChargeCategoryId && x.type === "expense");
      if(!c) c = cats.find(x => x.type === "expense" && x.name.toLowerCase() === "bank charges");
      if(!c){ c = { id: uid(), name: "Bank Charges", type: "expense" }; cats.push(c); }
      data.meta.bankChargeCategoryId = c.id;
      return c.id;
    },

    // Setup & meta
    completeSetup(){ data.setupDone = true; return commit(); },
    markMessageShown(id){ data.meta.shownMessages[id] = new Date().toISOString(); data.meta.lastModalAt = new Date().toISOString(); return commit(); },

    // Backup
    exportData(){ return JSON.stringify({ ...data, exportedAt: new Date().toISOString(), app: "alcaraz-business-tracker" }, null, 2); },
    importData(d){
      if(!isValid(d)) return false;
      const { exportedAt, app, ...rest } = d;
      data = normalize(rest);
      data.setupDone = true;
      commit();
      return true;
    },
    parseBackup(d){ return isValid(d) ? d : null; },

    // Delete all data. keepSetup = keep categories & payment methods, clear transactions only.
    resetData(keepSetup){
      if(keepSetup){
        data.transactions = [];
        data.meta.lastBackupAt = null;
      } else {
        data = defaults(); // back to Getting Started
      }
      return commit();
    },

    markBackup(){ data.meta.lastBackupAt = new Date().toISOString(); return commit(); },

    // Last app version this device has seen (for the one-time update notice)
    getSeenVersion(){ try{ return localStorage.getItem(VERSION_KEY); }catch(e){ return null; } },
    setSeenVersion(v){ try{ localStorage.setItem(VERSION_KEY, v); }catch(e){} },

    // Appearance preference (per device). Light is the default.
    getTheme(){ try{ return localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light"; }catch(e){ return "light"; } },
    setTheme(theme){ try{ localStorage.setItem(THEME_KEY, theme); }catch(e){} },

    // Anonymous usage stats (per device, never part of a backup): the user's choice,
    // a random install id, and when the last weekly summary was sent
    getStats(){
      try{ return Object.assign({ consent: null, installId: null, lastSentAt: null }, JSON.parse(localStorage.getItem(STATS_KEY) || "{}")); }
      catch(e){ return { consent: null, installId: null, lastSentAt: null }; }
    },
    setStats(patch){ try{ localStorage.setItem(STATS_KEY, JSON.stringify({ ...this.getStats(), ...patch })); }catch(e){} },

    // Learn tools (materials, recipes, break-even inputs). Saved with the records, so backups include them.
    toolkit(){
      const t = (data.toolkit && typeof data.toolkit === "object") ? data.toolkit : (data.toolkit = {});
      if(!Array.isArray(t.materials)) t.materials = [];
      if(!Array.isArray(t.products)) t.products = [];
      t.products.forEach(p => { if(!Array.isArray(p.lines)) p.lines = []; });
      if(!t.bep || typeof t.bep !== "object") t.bep = {};
      if(!Array.isArray(t.bep.rows)) t.bep.rows = [];
      if(!Array.isArray(t.bep.expenses)) t.bep.expenses = [];
      return t;
    },
    saveToolkit(){ return commit(); },
    newId: uid
  };
})();

/* =========================================================
   USAGE STATS — opt-in, anonymous, at most once a week.
   Sends a small summary (counts and size bands) to this site's
   own /api/heartbeat function. Never amounts, names, category
   names or descriptions. See netlify/functions/heartbeat.mjs.
   ========================================================= */
const Stats = {
  endpoint: "/api/heartbeat",
  everyDays: 7,
  // Only when served from the real site (not as a local file or inside another app's frame)
  available: /^https?:$/.test(location.protocol) && !(window.claude && typeof window.claude.use === "function"),
  band(n){ return n <= 0 ? "none" : n < 50000 ? "under_50k" : n < 200000 ? "50k_200k" : n < 500000 ? "200k_500k" : "500k_plus"; },
  summary(){
    const d = Store.get(), s = Store.getStats();
    const day = 86400000, now = Date.now();
    const iso = ms => isoOf(new Date(ms));
    const from7 = iso(now - 6 * day), from30 = iso(now - 29 * day), today = todayISO();
    const week = d.transactions.filter(t => t.date >= from7 && t.date <= today);
    const month = Calc.rangeTotals(from30, today);
    const createdDays = new Set(d.transactions.map(t => (t.createdAt || "").slice(0, 10)).filter(x => x && now - new Date(x).getTime() < 7 * day));
    const ua = navigator.userAgent;
    return {
      install_id: s.installId,
      app_version: CONFIG.version,
      weeks_since_install: Math.max(0, Math.floor((now - new Date(d.meta.firstUsedAt).getTime()) / (7 * day))) || 0,
      days_active_7d: Math.min(7, createdDays.size),
      sales_entries_7d: week.filter(t => t.type === "sales").length,
      expense_entries_7d: week.filter(t => t.type === "expense").length,
      transfer_entries_7d: week.filter(t => t.type === "transfer").length,
      total_entries: d.transactions.length,
      sales_band_30d: this.band(month.sales),
      expense_band_30d: this.band(month.expenses),
      // Actually used, not just present: new setups get Receivable/Payable modes by default
      uses_receivables: d.transactions.some(t => [t.paymentMethodId, t.fromPaymentMethodId, t.toPaymentMethodId].some(id => id && pmType(pmById(id)) !== "cash")),
      has_backup: !!d.meta.lastBackupAt,
      platform: /android/i.test(ua) ? "android" : /iphone|ipad|ipod/i.test(ua) ? "ios" : "desktop",
      display: isStandalone() ? "installed" : isInAppBrowser ? "in_app_browser" : "browser"
    };
  },
  // Called when the app opens and right after the user agrees. Fails silently; retried next time.
  async maybeSend(){
    const s = Store.getStats();
    if(!this.available || s.consent !== "yes" || !Store.get().setupDone || navigator.onLine === false) return;
    if(s.lastSentAt && Date.now() - new Date(s.lastSentAt).getTime() < this.everyDays * 86400000) return;
    if(!s.installId) Store.setStats({ installId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g, () => Math.floor(Math.random() * 16).toString(16)) });
    try{
      const res = await fetch(this.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(this.summary()) });
      if(res.ok) Store.setStats({ lastSentAt: new Date().toISOString() });
    }catch(e){}
  }
};

function registerServiceWorker(){
  if(!("serviceWorker" in navigator) || location.protocol === "file:") return;
  // The version in the URL makes each release install as an update
  navigator.serviceWorker.register(`sw.js?v=${encodeURIComponent(CONFIG.version)}`).then(reg => {
    const watch = w => w && w.addEventListener("statechange", () => {
      if(w.state === "installed" && navigator.serviceWorker.controller){ swWaiting = w; showUpdateBar(); }
    });
    if(reg.waiting && navigator.serviceWorker.controller){ swWaiting = reg.waiting; showUpdateBar(); }
    reg.addEventListener("updatefound", () => watch(reg.installing));
    // Check for updates when the app comes back to the foreground
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  // First install also fires this event; reload only for a user-requested update
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(refreshRequested){ refreshRequested = false; location.reload(); } });
}

/* =========================================================
   CALC — all numbers shown in the app come from here
   ========================================================= */
const Calc = {
  txInMonth(month){ return Store.get().transactions.filter(t => t.date.startsWith(month)); },
  monthTotals(month){ return this.totalsOf(this.txInMonth(month)); },
  // start and end are inclusive dates (the dashboard's day and week views)
  rangeTotals(start, end){ return this.totalsOf(Store.get().transactions.filter(t => t.date >= start && t.date <= end)); },
  totalsOf(txs){
    let sales = 0, expenses = 0; const byCat = {};
    txs.forEach(t => {
      if(t.type === "transfer"){
        // A transfer only moves money; its bank charge (if any) is an expense
        if(t.fee > 0){ expenses += t.fee; byCat[t.feeCategoryId] = (byCat[t.feeCategoryId] || 0) + t.fee; }
        return;
      }
      if(t.type === "sales") sales += t.amount; else expenses += t.amount;
      if(Array.isArray(t.lines)){
        t.lines.forEach(line => { byCat[line.categoryId] = (byCat[line.categoryId] || 0) + line.amount; });
      } else {
        byCat[t.categoryId] = (byCat[t.categoryId] || 0) + t.amount;
      }
    });
    return { sales, expenses, net: sales - expenses, count: txs.length, byCat };
  },
  // Cumulative across ALL recorded transactions, not limited to the selected month
  cashPosition(){
    const d = Store.get(); const by = {};
    d.paymentMethods.forEach(p => by[p.id] = 0);
    const add = (id, v) => { by[id] = (by[id] || 0) + v; };
    d.transactions.forEach(t => {
      if(t.type === "transfer"){
        add(t.fromPaymentMethodId, -(t.amount + (t.fee || 0))); // bank charge comes out of the sending account
        add(t.toPaymentMethodId, t.amount);
      } else {
        add(t.paymentMethodId, t.type === "sales" ? t.amount : -t.amount);
      }
    });
    // Total Available is cash-type modes only; receivables and payables are reported beside it
    const sum = type => d.paymentMethods.filter(p => pmType(p) === type).reduce((a, p) => a + by[p.id], 0);
    const total = sum("cash"), receivable = sum("receivable"), payable = -sum("payable"); // payable shown as a positive amount owed
    return { by, total, receivable, payable };
  },
  yearTotals(year){
    const out = { sales: 0, expenses: 0, byCat: {} };
    for(let m = 1; m <= 12; m++){
      const t = this.monthTotals(`${year}-${pad(m)}`);
      out.sales += t.sales; out.expenses += t.expenses;
      Object.entries(t.byCat).forEach(([id, v]) => { out.byCat[id] = (out.byCat[id] || 0) + v; });
    }
    out.net = out.sales - out.expenses;
    return out;
  },
  monthsWithData(){ return new Set(Store.get().transactions.map(t => t.date.slice(0, 7))).size; }
};

/* =========================================================
   HELPERS
   ========================================================= */
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const thisMonth = () => todayISO().slice(0, 7);
function shiftMonth(m, delta){ const [y, mo] = m.split("-").map(Number); const d = new Date(y, mo-1+delta, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function monthLabel(m, short){ const [y, mo] = m.split("-").map(Number); return new Date(y, mo-1, 1).toLocaleDateString("en-PH", short ? { month:"short" } : { month:"long", year:"numeric" }); }
function dateLabel(iso){ const [y, m, d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-PH", { month:"short", day:"numeric", year:"numeric" }); }
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function shiftDay(iso, delta){ const [y, m, d] = iso.split("-").map(Number); return isoOf(new Date(y, m-1, d+delta)); }
// Weeks run Monday to Sunday
function weekStart(iso){ const [y, m, d] = iso.split("-").map(Number); return shiftDay(iso, -((new Date(y, m-1, d).getDay() + 6) % 7)); }
function dayLabel(iso, withYear){ const [y, m, d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-PH", withYear ? { weekday:"short", month:"short", day:"numeric", year:"numeric" } : { month:"short", day:"numeric" }); }
// "Oct 5 – 11, 2026", "Sep 28 – Oct 4, 2026", "Dec 29, 2025 – Jan 4, 2026"
function rangeLabel(start, end){
  if(start === end) return dayLabel(start, true);
  const sameYear = start.slice(0, 4) === end.slice(0, 4), sameMonth = start.slice(0, 7) === end.slice(0, 7);
  return `${sameYear ? dayLabel(start) : dateLabel(start)} – ${sameMonth ? Number(end.slice(8)) + ", " + end.slice(0, 4) : dateLabel(end)}`;
}
// The period the Dashboard is showing. Day and Week are Dashboard-only; the other views stay
// monthly and show ui.month, which follows the selected day.
function dashPeriod(){
  if(ui.dashMode === "month") return { mode: "month", scope: ui.month, label: monthLabel(ui.month), prevLabel: monthLabel(shiftMonth(ui.month, -1), true) };
  // The month was changed elsewhere (another view, or Month mode): start from today or that month's first day
  if(ui.dashDate.slice(0, 7) !== ui.month) ui.dashDate = ui.month === thisMonth() ? todayISO() : ui.month + "-01";
  if(ui.dashMode === "day"){
    const prev = shiftDay(ui.dashDate, -1);
    return { mode: "day", start: ui.dashDate, end: ui.dashDate, prevStart: prev, prevEnd: prev, scope: `${ui.dashDate}..${ui.dashDate}`, label: dayLabel(ui.dashDate, true), prevLabel: dayLabel(prev) };
  }
  const start = weekStart(ui.dashDate), end = shiftDay(start, 6);
  return { mode: "week", start, end, prevStart: shiftDay(start, -7), prevEnd: shiftDay(start, -1), scope: `${start}..${end}`, label: rangeLabel(start, end), prevLabel: "previous week" };
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

function pmIcon(name){
  const n = name.toLowerCase();
  const svg = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
  if(/g ?cash|maya|paymaya|wallet|coins|grab ?pay|shopee ?pay/.test(n)) return svg('<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>');
  if(/bank|bdo|bpi|metrobank|landbank|pnb|rcbc|unionbank|security ?bank|chinabank|eastwest|gotyme|seabank|cimb/.test(n)) return svg('<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>');
  if(/cash/.test(n)) return svg('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>');
  return svg('<path d="M3 7a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M16 13h2"/>');
}

// "Updated just now" / "Last transaction: Sep 25, 2026"
function lastUpdated(){
  const txs = Store.get().transactions;
  if(!txs.length) return "";
  const latest = txs.reduce((m, t) => ((t.updatedAt || t.createdAt || "") > m ? (t.updatedAt || t.createdAt) : m), "");
  if(!latest) return "";
  const mins = (Date.now() - new Date(latest).getTime()) / 60000;
  let text;
  if(mins < 1) text = "Updated just now";
  else if(mins < 60) text = `Updated ${Math.floor(mins)} min ago`;
  else if(new Date(latest).toDateString() === new Date().toDateString()) text = "Updated today";
  else text = `Last transaction: ${new Date(latest).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" })}`;
  return `<p class="updated"><span class="dot" aria-hidden="true"></span>${text}</p>`;
}

// prevLabel names the period being compared with: "Sep", "Oct 4", "previous week"
function compare(cur, prev, prevLabel, goodWhenUp, money){
  const pm = esc(prevLabel);
  if(prev === 0) return `<div class="cmp">No ${pm} data to compare</div>`;
  if(cur === prev) return `<div class="cmp">Same as ${pm}</div>`;
  const up = cur > prev;
  const cls = (up === goodWhenUp) ? "good" : "bad";
  const arrow = up ? "▲" : "▼";
  if(money === "amount"){
    return `<div class="cmp ${cls}">${arrow} ${peso(Math.abs(cur - prev))} vs ${pm}</div>`;
  }
  const pct = Math.abs((cur - prev) / Math.abs(prev) * 100);
  return `<div class="cmp ${cls}">${arrow} ${pct.toFixed(0)}% vs ${pm}</div>`;
}

   ========================================================= */
function render(){
  const app = document.getElementById("app");
  // "?privacy" shows the public privacy notice on its own, without the app around it
  if(/[?&]privacy(=|&|$)/.test(location.search)){ app.innerHTML = Views.privacy(); document.title = "Privacy Notice · " + CONFIG.appName; return; }
  const d = Store.get();
  if(!d.setupDone){ app.innerHTML = Views.setup(); return; }

  const navView = TOOL_VIEWS.includes(ui.view) ? "learn" : ui.view; // tools sit under Learn in the menu
  const sideLinks = NAV.map(n => `<button class="side-link ${navView === n.view ? "on" : ""}" data-action="nav" data-view="${n.view}" ${navView === n.view ? 'aria-current="page"' : ""}>${ICONS[n.view]}${n.label}${n.view === "learn" ? tkBadge() : ""}</button>`).join("");
  const bottom = [...NAV, { view: "settings", short: "Settings" }].map(n => `<button class="${navView === n.view ? "on" : ""}" data-action="nav" data-view="${n.view}" ${navView === n.view ? 'aria-current="page"' : ""}>${ICONS[n.view]}${n.short}${n.view === "learn" ? tkBadge() : ""}</button>`).join("");

  app.innerHTML = `<div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand-name">${esc(CONFIG.appName)}</div>
      <div class="brand-tag">by ${esc(CONFIG.author)} ${CONFIG.beta ? `<span class="beta">Public Beta</span>` : ""}</div>
      <button class="btn block add-btn" data-action="openAdd">＋ Add Transaction</button>
      ${sideLinks}
      <div class="side-sep"></div>
      <button class="side-link ${ui.view === "settings" ? "on" : ""}" data-action="nav" data-view="settings">${ICONS.settings}Settings</button>
      <div class="side-foot"><button data-action="openSupport">Support this project</button></div>
    </aside>
    <div>
      <header class="topbar"><span class="brand-name">${esc(CONFIG.appName)}</span>${CONFIG.beta ? `<span class="beta">Public Beta</span>` : ""}</header>
      <main id="main">${topBanners()}${Views[ui.view]()}</main>
    </div>
  </div>
  <nav class="bottomnav" aria-label="Main navigation"><div class="in">${bottom}</div></nav>
  ${navView === "learn" ? "" : `<button class="fab" data-action="openAdd" aria-label="Add Transaction">＋</button>`}`;
  if(TOOL_VIEWS.includes(ui.view)) TK.refresh();
}
function go(view){
  if(view !== ui.view){
    const depth = histDepth();
    // Dashboard is the bottom of the back stack, so Back from it leaves the app
    if(view === "dashboard" && depth > 0) histBack(depth);
    else histPush({ view, depth: depth + 1 });
    ui.view = view;
  }
  render(); window.scrollTo(0, 0);
}

/* =========================================================
   BACK BUTTON — the phone's Back closes the top overlay first,
   then returns to the previous view, and only leaves the app
   from the Dashboard. Each view change and each open overlay
   is one browser-history entry.
   ========================================================= */
let navBusy = 0; // non-zero while our own history.go() is in flight
const isView = v => v === "settings" || NAV.some(n => n.view === v) || (TOOLKIT_ON && TOOL_VIEWS.includes(v));
const histState = () => (history.state && history.state.abt) ? history.state : null;
const histDepth = () => { const s = histState(); return s ? s.depth : 0; };
const overlayOpen = () => !!document.getElementById("overlayRoot").firstElementChild;
function histPush(state){ try{ history.pushState({ abt: true, ...state }, ""); }catch(e){} }
function histBack(n){
  const token = navBusy = Date.now() + Math.random();
  setTimeout(() => { if(navBusy === token) navBusy = 0; }, 1000); // in case popstate never comes
  try{ history.go(-n); }catch(e){ navBusy = 0; }
}
// Keep history in step with the screen: one extra entry while an overlay is open
function syncHistory(){
  if(navBusy) return;
  const s = histState(), open = overlayOpen();
  if(open && !(s && s.ov)) histPush({ view: ui.view, depth: histDepth() + 1, ov: true });
  else if(!open && s && s.ov) histBack(1);
}
window.addEventListener("popstate", () => {
  if(navBusy){ navBusy = 0; syncHistory(); return; }
  if(overlayOpen()) dismissTop();
  else {
    const s = histState(), view = s && isView(s.view) ? s.view : "dashboard";
    if(view !== ui.view && Store.get().setupDone){ ui.view = view; render(); window.scrollTo(0, 0); }
  }
  setTimeout(syncHistory, 0);
});

/* =========================================================
   OVERLAYS — form sheet and reusable dialog
   ========================================================= */
let overlayClose = null;
let sheetReturn = null; // set while a form is open on behalf of a drill-down sheet
function openOverlay(html, centered){
  const root = document.getElementById("overlayRoot");
  root.innerHTML = `<div class="overlay ${centered ? "center" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  const ov = root.firstElementChild;
  ov.addEventListener("click", e => { if(e.target === ov && overlayClose) overlayClose("dismiss"); });
  syncHistory();
  return ov;
}
// Mobile keyboards cover fixed-position content in many browsers (incl. Messenger's).
// Track the visible viewport so the form sheet always sits above the keyboard.
function syncViewport(){
  const vv = window.visualViewport;
  const root = document.documentElement.style;
  if(!vv){ root.removeProperty("--vv-height"); root.removeProperty("--vv-top"); return; }
  root.setProperty("--vv-height", vv.height + "px");
  root.setProperty("--vv-top", vv.offsetTop + "px");
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", syncViewport);
  window.visualViewport.addEventListener("scroll", syncViewport);
}
syncViewport();

// Keep the field being typed in visible once the keyboard has opened
document.addEventListener("focusin", e => {
  const el = e.target;
  if(!el.closest || !el.closest(".sheet") || !el.matches("input, select, textarea")) return;
  setTimeout(() => { syncViewport(); el.scrollIntoView({ block: "center", behavior: "smooth" }); }, 300);
});

function closeOverlay(){
  document.getElementById("overlayRoot").innerHTML = ""; overlayClose = null; discardDone = null;
  // A form opened from a drill-down sheet goes back to that sheet, redrawn
  const back = sheetReturn; sheetReturn = null;
  if(back) back();
  setTimeout(syncHistory, 0); // deferred: another overlay may open right away
}
// Back, Escape: close whatever is on top
function dismissTop(){ if(discardDone) discardDone(false); else if(overlayClose) overlayClose("dismiss"); }

// Small confirm shown on top of the transaction form. Resolves true to discard.
let discardDone = null;
function askDiscard(editing){
  return new Promise(resolve => {
    const root = document.getElementById("overlayRoot");
    root.insertAdjacentHTML("beforeend", `<div class="overlay center" role="alertdialog" aria-modal="true"><div class="dialog">
      <h2>${editing ? "Discard your changes?" : "Discard this entry?"}</h2><div class="body"><p>What you typed hasn't been saved.</p></div>
      <div class="actions"><button class="btn solid-danger block" data-discard="1">Discard</button><button class="btn ghost block" data-discard="">Keep editing</button></div></div></div>`);
    const layer = root.lastElementChild;
    discardDone = v => { discardDone = null; layer.remove(); resolve(v); };
    layer.addEventListener("click", e => {
      const b = e.target.closest("[data-discard]");
      if(b) discardDone(!!b.dataset.discard); else if(e.target === layer) discardDone(false);
    });
    layer.querySelector('[data-discard=""]').focus();
  });
}
document.addEventListener("keydown", e => { if(e.key === "Escape") dismissTop(); });

// Reusable modal: returns "primary" | "secondary" | "dismiss"
function showDialog({ title, body, primaryLabel, primaryUrl, secondaryLabel, danger }){
  return new Promise(resolve => {
    const paras = (Array.isArray(body) ? body : [body]).map(p => `<p>${esc(p)}</p>`).join("");
    const primary = primaryUrl
      ? `<a class="btn primary block" id="dlgPrimary" href="${esc(primaryUrl)}" target="_blank" rel="noopener">${esc(primaryLabel)}</a>`
      : `<button class="btn ${danger ? "solid-danger" : "primary"} block" id="dlgPrimary">${esc(primaryLabel)}</button>`;
    const ov = openOverlay(`<div class="dialog"><h2>${esc(title)}</h2><div class="body">${paras}</div>
      <div class="actions">${primary}${secondaryLabel ? `<button class="btn ghost block" id="dlgSecondary">${esc(secondaryLabel)}</button>` : ""}</div></div>`, true);
    const done = v => { closeOverlay(); resolve(v); };
    overlayClose = done;
    // Links close on the next tick so the browser can open them first
    ov.querySelector("#dlgPrimary").addEventListener("click", () => primaryUrl ? setTimeout(() => done("primary"), 0) : done("primary"));
    const sec = ov.querySelector("#dlgSecondary"); if(sec) sec.addEventListener("click", () => done("secondary"));
    (sec || ov.querySelector("#dlgPrimary")).focus();
  });
}
const confirmDialog = (title, body, okLabel) =>
  showDialog({ title, body, primaryLabel: okLabel, secondaryLabel: "Cancel", danger: true }).then(r => r === "primary");

/* ---------- Add / Edit Transaction (Sales, Expense, Transfer) ---------- */
let formType = "sales";
function categoryOptions(type, selectedId){
  const cats = Store.get().categories.filter(c => c.type === type);
  return `<option value="">Choose a category</option>` + cats.map(c => `<option value="${c.id}" ${c.id === selectedId ? "selected" : ""}>${esc(c.name)}</option>`).join("");
}
// Sales can go to cash or a receivable, expenses to cash or a payable; transfers can use any mode
const PM_TYPES_FOR = { sales: ["cash", "receivable"], expense: ["cash", "payable"], transfer: PM_TYPES };
// keepId: the mode an existing entry already uses stays selectable even if its type no longer fits
function pmChips(name, selectedId, label, types = PM_TYPES, keepId){
  return `<div class="chips" role="radiogroup" aria-label="${esc(label)}">
    ${Store.get().paymentMethods.filter(p => types.includes(pmType(p)) || p.id === keepId).map(p => `<label class="chip"><input type="radio" name="${name}" value="${p.id}" ${p.id === selectedId ? "checked" : ""}><span>${esc(p.name)}</span></label>`).join("")}
  </div>`;
}
const lastCashPm = () => {
  const d = Store.get(), last = pmById(d.meta.lastPaymentMethodId);
  return (last && pmType(last) === "cash" ? last : d.paymentMethods.find(p => pmType(p) === "cash") || d.paymentMethods[0])?.id;
};
// Form details that depend on the chosen modes: the receivable/payable hint and the bank-charge field
function syncPmFields(form){
  const picked = name => pmType(pmById(form.querySelector(`input[name="${name}"]:checked`)?.value));
  const isT = formType === "transfer";
  const t = isT ? "cash" : picked("paymentMethodId");
  const sub = isT ? "" : pmById(form.querySelector('input[name="paymentMethodId"]:checked')?.value)?.subtitle;
  form.querySelector("#rpHint").textContent = (sub ? sub + ". " : "") + (t === "receivable" ? "Collected later? Record it as a Transfer, not a new sale."
    : t === "payable" ? "Paid later? Record it as a Transfer, not a new expense." : "");
  // A bank charge only makes sense between two cash modes
  form.querySelector("#grpFee").classList.toggle("hidden", !isT || picked("fromPm") !== "cash" || picked("toPm") !== "cash");
}
function lineRows(tx){
  if(tx && tx.type !== "transfer"){
    if(Array.isArray(tx.lines) && tx.lines.length) return tx.lines;
    if(tx.categoryId) return [{ categoryId: tx.categoryId, amount: tx.amount || 0 }];
  }
  return [{ categoryId: "", amount: 0 }];
}
function lineRowHtml(line, index, type){
  return `<div class="line-item" data-line-row>
    <span class="line-no">${index + 1}</span>
    <select name="lineCategory" aria-label="Category for line ${index + 1}">${categoryOptions(type, line.categoryId || "")}</select>
    <input name="lineAmount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${line.amount ? Number(line.amount).toFixed(2) : ""}" aria-label="Amount for line ${index + 1}">
    <button type="button" class="remove-line" data-remove-line aria-label="Remove line ${index + 1}">×</button>
  </div>`;
}
function lineItemsHtml(tx, type){
  const rows = lineRows(tx);
  return `<div class="line-items" id="lineItems">
    <div class="line-items-head"><span>#</span><span>Category</span><span style="text-align:right">Amount</span><span></span></div>
    <div id="lineRows">${rows.map((line, i) => lineRowHtml(line, i, type)).join("")}</div>
    <button type="button" class="line-add" data-add-line>＋ Add Line</button>
    <div class="line-total"><span>Total</span><span class="value num" id="lineTotal">₱0.00</span></div>
  </div>`;
}
function refreshLineNumbers(form){
  form.querySelectorAll("#lineRows [data-line-row]").forEach((row, i) => {
    row.querySelector(".line-no").textContent = i + 1;
    row.querySelector(".remove-line").setAttribute("aria-label", `Remove line ${i + 1}`);
    row.querySelector("[name=lineCategory]").setAttribute("aria-label", `Category for line ${i + 1}`);
    row.querySelector("[name=lineAmount]").setAttribute("aria-label", `Amount for line ${i + 1}`);
  });
}
function updateLineTotal(form){
  const total = [...form.querySelectorAll("[name=lineAmount]")].reduce((sum, input) => sum + (parseMoney(input.value) || 0), 0);
  const el = form.querySelector("#lineTotal");
  if(el) el.textContent = peso(total);
  return Math.round(total * 100) / 100;
}
function addLineRow(form){
  const type = formType === "transfer" ? "expense" : formType;
  const rows = form.querySelector("#lineRows");
  const index = rows.querySelectorAll("[data-line-row]").length;
  rows.insertAdjacentHTML("beforeend", lineRowHtml({ categoryId: "", amount: 0 }, index, type));
  refreshLineNumbers(form);
  updateLineTotal(form);
  const inputs = rows.querySelectorAll("[name=lineCategory]");
  if(inputs.length) inputs[inputs.length - 1].focus();
}
function openTxForm(tx){
  const d = Store.get();
  if(tx) formType = tx.type;
  const isT = formType === "transfer";
  const regular = tx && tx.type !== "transfer" ? tx : null;
  const transfer = tx && tx.type === "transfer" ? tx : null;

  const lastPm = lastCashPm();
  const pmSel = regular ? regular.paymentMethodId : lastPm;
  const fromSel = transfer ? transfer.fromPaymentMethodId : lastPm;
  const toSel = transfer ? transfer.toPaymentMethodId : d.paymentMethods.find(p => p.id !== fromSel)?.id;

  const typeBtn = (v, l, sub) => `<button type="button" data-action="formType" data-v="${v}" class="type-btn ${formType === v ? "on" : ""}">${l}${sub ? `<small>${sub}</small>` : ""}</button>`;
  const transferFields = d.paymentMethods.length < 2
    ? `<p class="muted small" style="margin:14px 0 0">Add at least two payment methods in Settings to record a transfer.</p>`
    : `<div class="field"><span>From</span>${pmChips("fromPm", fromSel, "From")}</div>
       <div class="field"><span>To</span>${pmChips("toPm", toSel, "To")}</div>`;

  const ov = openOverlay(`<form class="sheet" id="txForm" novalidate>
    <h2>${tx ? "Edit Transaction" : "Add Transaction"}</h2>
    <div class="field"><span>Type</span>
      <div class="seg type" role="group" aria-label="Type" style="width:100%">
        ${typeBtn("sales", "Sales", "Collection")}${typeBtn("expense", "Expense", "Payment")}${typeBtn("transfer", "Transfer")}
      </div>
    </div>
    <label class="field"><span>Date</span><input type="date" name="date" value="${esc(tx ? tx.date : todayISO())}" required></label>
    <div id="grpRegular" class="${isT ? "hidden" : ""}">
      <div class="field"><span>Line Items</span>${lineItemsHtml(regular, formType)}</div>
      <div class="field"><span>Mode of Payment</span><div id="pmRegular">${pmChips("paymentMethodId", pmSel, "Mode of Payment", PM_TYPES_FOR[isT ? "expense" : formType], regular ? regular.paymentMethodId : null)}</div>
        <div class="hint" id="rpHint"></div></div>
    </div>
    <div id="grpTransfer" class="${isT ? "" : "hidden"}">${transferFields}</div>
    <div id="grpTransferAmount" class="field ${isT ? "" : "hidden"}"><span>Amount (₱)</span><input class="amount num" name="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${transfer ? transfer.amount.toFixed(2) : ""}"></div>
    <label class="field hidden" id="grpFee"><span>Bank charge (₱) — optional</span>
      <input name="fee" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${transfer && transfer.fee > 0 ? transfer.fee.toFixed(2) : ""}">
      <div class="hint">Deducted from the "From" account and counted as an expense under Bank Charges.</div>
    </label>
    <label class="field"><span>Description</span><input name="description" maxlength="140" placeholder="Optional" value="${esc(tx ? tx.description || "" : "")}"></label>
    <p class="form-err" id="formErr"></p>
    <div class="sheet-actions">
      <button type="submit" class="btn primary block" style="min-height:50px">Save Transaction</button>
      ${tx ? `<div class="two"><button type="button" class="btn" data-action="closeForm">Cancel</button><button type="button" class="btn danger" data-action="deleteTx" data-id="${tx.id}">Delete</button></div>`
           : `<button type="button" class="btn ghost block" data-action="closeForm">Cancel</button>`}
    </div>
  </form>`);
  const form = ov.querySelector("#txForm");
  form.addEventListener("submit", e => { e.preventDefault(); saveTx(form, tx); });
  form.addEventListener("input", e => { if(e.target.name === "lineAmount") updateLineTotal(form); });
  form.addEventListener("change", e => { if(e.target.type === "radio") syncPmFields(form); });
  // Editing keeps the entry's own mode selectable while its type is unchanged
  form.dataset.keepPm = regular ? `${regular.type}:${regular.paymentMethodId}` : "";
  syncPmFields(form);
  form.addEventListener("click", e => {
    const add = e.target.closest("[data-add-line]");
    if(add){ addLineRow(form); return; }
    const remove = e.target.closest("[data-remove-line]");
    if(remove){
      const rows = form.querySelectorAll("#lineRows [data-line-row]");
      if(rows.length <= 1){ toast("Keep at least one line."); return; }
      remove.closest("[data-line-row]").remove();
      refreshLineNumbers(form); updateLineTotal(form);
    }
  });
  refreshLineNumbers(form);
  updateLineTotal(form);
  // Back / Escape / tapping outside ask before throwing away typed input
  const snapshot = () => formType + "|" + new URLSearchParams(new FormData(form)).toString();
  const initial = snapshot();
  const dirty = () => tx ? snapshot() !== initial
    : [...form.querySelectorAll("[name=lineAmount], [name=amount]")].some(i => i.value.trim());
  overlayClose = async () => { if(!dirty() || await askDiscard(!!tx)) closeOverlay(); };
  if(!tx && isT && window.matchMedia("(pointer: fine)").matches) setTimeout(() => form.amount.focus(), 50);
}

const parseMoney = v => Math.round(parseFloat(String(v).replace(/[,₱\s]/g, "")) * 100) / 100;

async function saveTx(form, tx){
  const err = msg => { form.querySelector("#formErr").textContent = msg; };
  const date = form.date.value;
  const description = form.description.value.trim().slice(0, 140);
  const checked = name => form.querySelector(`input[name="${name}"]:checked`)?.value;

  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("Please choose a date.");

  let payload, amount = 0;
  if(formType === "transfer"){
    if(Store.get().paymentMethods.length < 2) return err("Add at least two payment methods in Settings to record a transfer.");
    const from = checked("fromPm"), to = checked("toPm");
    if(!from || !to) return err("Please choose where the money is coming from and going to.");
    if(from === to) return err("From and To must be different payment methods.");
    amount = parseMoney(form.amount.value);
    if(!(amount > 0)) return err("Please enter an amount greater than zero.");
    // No bank charge on transfers that involve a receivable or payable (the field is hidden)
    const feeRaw = [from, to].every(id => pmType(pmById(id)) === "cash") ? form.fee.value.trim() : "";
    const fee = feeRaw ? parseMoney(feeRaw) : 0;
    if(feeRaw && !(fee >= 0)) return err("Enter a valid bank charge, or leave it blank.");
    payload = { date, type: "transfer", fromPaymentMethodId: from, toPaymentMethodId: to, amount, fee, description };
    if(fee > 0) payload.feeCategoryId = Store.ensureBankChargeCategory();
  } else {
    const pm = checked("paymentMethodId");
    if(!pm) return err("Please choose a mode of payment.");
    const lines = [...form.querySelectorAll("#lineRows [data-line-row]")].map(row => ({
      categoryId: row.querySelector("[name=lineCategory]").value,
      amount: parseMoney(row.querySelector("[name=lineAmount]").value)
    }));
    if(lines.some(line => !line.categoryId)) return err("Please choose a category for every line.");
    if(lines.some(line => !(line.amount > 0))) return err("Please enter an amount greater than zero for every line.");
    amount = Math.round(lines.reduce((sum, line) => sum + line.amount, 0) * 100) / 100;
    if(!(amount > 0)) return err("Please enter at least one line item.");
    payload = { date, type: formType, categoryId: lines[0].categoryId, paymentMethodId: pm, amount, lines, description };
  }

  if(tx) await Store.updateTransaction(tx.id, payload);
  else await Store.addTransaction(payload);

  closeOverlay();
  ui.month = date.slice(0, 7); ui.dashDate = date;
  render();
  const label = { sales: "Sales", expense: "Expense", transfer: "Transfer" }[formType];
  toast(tx ? "Transaction updated." : `Saved: ${label} ${peso(amount)}`);
  checkMilestones();
}
